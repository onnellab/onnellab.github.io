name: One-time polish TagWeaver 2.3 release copy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-polish-tagweaver-2-3-notes.yml

permissions:
  contents: write

concurrency:
  group: one-time-polish-tagweaver-2-3-notes
  cancel-in-progress: false

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Polish localized summaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('src/lib/releaseNotes.ts')
          extended_path = Path('src/lib/extended-release-notes.ts')

          core = core_path.read_text(encoding='utf-8')
          core_replacements = {
              'iOS와 Android에 심사를 제출한 TagWeaver 2.3 업데이트의 공용 릴리즈 노트예요.': 'iOS와 Android 스토어 심사에 제출한 TagWeaver 2.3 업데이트의 공용 릴리즈 노트예요.',
          }
          for old, new in core_replacements.items():
              count = core.count(old)
              if count != 1:
                  raise SystemExit(f'expected one core localization match, found {count}: {old}')
              core = core.replace(old, new, 1)
          core_path.write_text(core, encoding='utf-8')

          extended = extended_path.read_text(encoding='utf-8')
          extended_replacements = {
              'iOS と Android で審査提出した TagWeaver 2.3 共通のリリースノートです。': 'iOS と Android の審査に提出した TagWeaver 2.3 共通のリリースノートです。',
              'Notas da versão do TagWeaver 2.3, enviado para análise no iOS e no Android.': 'Notas da versão do TagWeaver 2.3 para iOS e Android. A atualização está em análise nas lojas.',
              'Gemeinsame Versionshinweise für TagWeaver 2.3, das für iOS und Android zur Prüfung eingereicht wurde.': 'Gemeinsame Versionshinweise zu TagWeaver 2.3 für iOS und Android. Das Update wurde zur Prüfung eingereicht.',
              'Notes de version communes de TagWeaver 2.3, soumis à validation sur iOS et Android.': 'Notes de version communes de TagWeaver 2.3 pour iOS et Android. La mise à jour a été soumise à validation.',
              'Notas de la versión de TagWeaver 2.3, enviada a revisión para iOS y Android.': 'Notas de la versión de TagWeaver 2.3 para iOS y Android. La actualización está en revisión.',
          }
          for old, new in extended_replacements.items():
              count = extended.count(old)
              if count != 1:
                  raise SystemExit(f'expected one extended localization match, found {count}: {old}')
              extended = extended.replace(old, new, 1)
          extended_path.write_text(extended, encoding='utf-8')

          expected = [
              'iOS와 Android 스토어 심사에 제출한 TagWeaver 2.3 업데이트의 공용 릴리즈 노트예요.',
              'iOS と Android の審査に提出した TagWeaver 2.3 共通のリリースノートです。',
              'Notas da versão do TagWeaver 2.3 para iOS e Android. A atualização está em análise nas lojas.',
              'Gemeinsame Versionshinweise zu TagWeaver 2.3 für iOS und Android. Das Update wurde zur Prüfung eingereicht.',
              'Notes de version communes de TagWeaver 2.3 pour iOS et Android. La mise à jour a été soumise à validation.',
              'Notas de la versión de TagWeaver 2.3 para iOS y Android. La actualización está en revisión.',
          ]
          combined = core_path.read_text(encoding='utf-8') + extended_path.read_text(encoding='utf-8')
          for sentence in expected:
              if combined.count(sentence) != 1:
                  raise SystemExit(f'polished sentence validation failed: {sentence}')
          print('Polished TagWeaver 2.3 release-note copy.')
          PY

          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate localization and production build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check:i18n-quality
          npm run build

      - name: Commit polished copy and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-polish-tagweaver-2-3-notes.yml
          git config user.name "ONNELLAB"
          git config user.email "akinstun21@gmail.com"
          git add src/lib/releaseNotes.ts src/lib/extended-release-notes.ts .github/workflows/one-time-polish-tagweaver-2-3-notes.yml
          git diff --cached --check
          git commit -m "docs: polish TagWeaver 2.3 release copy" -m "Refine Korean, Japanese, Portuguese, German, French, and Spanish wording."
          git pull --rebase origin main
          git push origin HEAD:main
