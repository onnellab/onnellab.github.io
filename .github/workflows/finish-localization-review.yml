name: Finish localization quality review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-localization-review.yml'

permissions:
  contents: write

concurrency:
  group: finish-localization-review-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure Git
        run: |
          git config user.name "ONNELLAB Automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Localize accessibility labels
        run: |
          set -euo pipefail
          node scripts/apply-localization-review.mjs accessibility
          npm run build
          npx playwright test tests/accessibility-i18n.spec.ts --project=desktop
          git add src tests .github/workflows/i18n-smoke.yml
          if ! git diff --cached --quiet; then
            git commit -m "Localize accessibility labels across nine languages"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Correct confirmed localization errors
        run: |
          set -euo pipefail
          node scripts/apply-localization-review.mjs corrections
          npm run build
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Correct confirmed localization errors"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Clarify privacy and purchase terminology
        run: |
          set -euo pipefail
          node scripts/apply-localization-review.mjs legal
          npm run build
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Clarify localized privacy and purchase terminology"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Rewrite release notes for users
        run: |
          set -euo pipefail
          node scripts/apply-localization-review.mjs release
          npm run build
          npx playwright test tests/product-contract.spec.ts --project=desktop
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Rewrite TagWeaver release notes for users"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Normalize terminology and add regression checks
        run: |
          set -euo pipefail
          node scripts/apply-localization-review.mjs terminology
          npm run check:i18n-quality
          npm run build
          git add src tests scripts/check-localization-quality.mjs package.json .github/workflows/i18n-smoke.yml
          if ! git diff --cached --quiet; then
            git commit -m "Normalize localized terminology and guard quality"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify final tree and remove one-time files
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm -f scripts/apply-localization-review.mjs .github/workflows/finish-localization-review.yml
          npm run check:i18n-quality
          npm run build
          npx playwright test \
            tests/site-i18n.spec.ts \
            tests/accessibility-i18n.spec.ts \
            tests/extended-i18n.spec.ts \
            tests/papira-i18n.spec.ts \
            tests/product-contract.spec.ts \
            tests/site-visual.spec.ts \
            --project=desktop
          git add -A
          git commit -m "Complete nine-language localization quality pass"
          git push origin HEAD:main
