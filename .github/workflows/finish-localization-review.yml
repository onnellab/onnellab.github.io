name: Finish localization quality review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-localization-review.yml'

permissions:
  contents: write

concurrency:
  group: finish-localization-review-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure Git
        run: |
          git config user.name "ONNELLAB Automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Localize legacy Melivra privacy navigation
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path

          english = Path('src/pages/melivra-privacy-policy/index.astro')
          source = english.read_text(encoding='utf-8')
          source = source.replace('aria-label="Navigation"', 'aria-label="Site navigation"')
          source = source.replace('aria-label="한국어로 보기"', 'aria-label="View in Korean"')
          english.write_text(source, encoding='utf-8')

          korean = Path('src/pages/melivra-privacy-policy/ko.astro')
          source = korean.read_text(encoding='utf-8')
          source = source.replace('aria-label="Navigation"', 'aria-label="탐색"')
          source = source.replace('aria-label="Switch to English"', 'aria-label="영어로 보기"')
          source = source.replace('작성 날짜 {updatedAt}', '최종 업데이트 {updatedAt}')
          korean.write_text(source, encoding='utf-8')
          PY
          npm run build
          git add src/pages/melivra-privacy-policy
          if ! git diff --cached --quiet; then
            git commit -m "Localize legacy Melivra privacy navigation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Normalize terminology and add regression checks
        run: |
          set -euo pipefail
          git pull --rebase origin main
          node --check scripts/apply-localization-review.mjs
          node scripts/apply-localization-review.mjs terminology
          git checkout -- .github/workflows/i18n-smoke.yml
          npm run check:i18n-quality
          npm run build
          git add src tests scripts/check-localization-quality.mjs package.json
          if ! git diff --cached --quiet; then
            git commit -m "Normalize localized terminology and guard quality"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify final tree and remove one-time scripts
        run: |
          set -euo pipefail
          git pull --rebase origin main
          npm run check:i18n-quality
          npm run build
          npx playwright test \
            tests/site-i18n.spec.ts \
            tests/accessibility-i18n.spec.ts \
            tests/extended-i18n.spec.ts \
            tests/papira-i18n.spec.ts \
            tests/product-contract.spec.ts \
            tests/site-visual.spec.ts \
            --project=desktop
          rm -f \
            scripts/apply-localization-review.mjs \
            scripts/run-localization-review.mjs \
            scripts/apply_remaining_localization_fixes.py
          git add -u scripts
          if ! git diff --cached --quiet; then
            git commit -m "Complete nine-language localization quality pass"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
