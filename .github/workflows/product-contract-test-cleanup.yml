name: One-time product contract test cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/product-contract-test-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure Git
        run: |
          git config user.name "ONNELLAB test cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Normalize product contract test indentation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('tests/product-contract.spec.ts')
          source = path.read_text(encoding='utf-8')
          old = """      await expect(page.locator('.download-band')).toHaveCount(1);
          if (locale.code === 'pt-BR') {
            await expect(page.locator('.download-band')).toHaveAttribute('aria-label', 'Baixar');
            await expect(page.locator('.download-band > .eyebrow')).toHaveText('Baixar');
          }
          if (locale.code === 'de') {
            const storeActions = page.locator('.download-band .actions.compact');
            if (await storeActions.count()) {
              await expect(storeActions).toHaveAttribute('aria-label', 'App-Stores');
            }
          }
          await expect(page.locator('.site-footer')).toHaveCount(1);"""
          new = """      await expect(page.locator('.download-band')).toHaveCount(1);
                if (locale.code === 'pt-BR') {
                  await expect(page.locator('.download-band')).toHaveAttribute('aria-label', 'Baixar');
                  await expect(page.locator('.download-band > .eyebrow')).toHaveText('Baixar');
                }
                if (locale.code === 'de') {
                  const storeActions = page.locator('.download-band .actions.compact');
                  if (await storeActions.count()) {
                    await expect(storeActions).toHaveAttribute('aria-label', 'App-Stores');
                  }
                }
                await expect(page.locator('.site-footer')).toHaveCount(1);"""
          old = old.replace('          if', '    if').replace('            await', '      await').replace('            const', '      const').replace('            if', '      if').replace('              await', '        await').replace('            }', '      }').replace('          }', '    }').replace('          await expect(page.locator(\'.site-footer\'))', '    await expect(page.locator(\'.site-footer\'))')
          new = new.replace('                if', '      if').replace('                  await', '        await').replace('                  const', '        const').replace('                  if', '        if').replace('                    await', '          await').replace('                  }', '        }').replace('                }', '      }').replace('                await expect(page.locator(\'.site-footer\'))', '      await expect(page.locator(\'.site-footer\'))')
          if source.count(old) != 1:
              raise SystemExit(f'indentation block count: {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git add tests/product-contract.spec.ts
          git commit -m "Normalize product contract test indentation"

      - name: Require German store label coverage
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('tests/product-contract.spec.ts')
          source = path.read_text(encoding='utf-8')
          old = """      if (locale.code === 'de') {
                const storeActions = page.locator('.download-band .actions.compact');
                if (await storeActions.count()) {
                  await expect(storeActions).toHaveAttribute('aria-label', 'App-Stores');
                }
              }"""
          old = old.replace('                const', '        const').replace('                if', '        if').replace('                  await', '          await').replace('                }', '        }').replace('              }', '      }')
          new = """      // TagWeaver is released on both stores, so this assertion cannot pass vacuously.
              if (locale.code === 'de' && app === 'tagweaver') {
                const storeActions = page.locator('.download-band .actions.compact');
                await expect(storeActions).toHaveCount(1);
                await expect(storeActions).toHaveAttribute('aria-label', 'App-Stores');
              }"""
          new = new.replace('              if', '      if').replace('                const', '        const').replace('                await', '        await').replace('              }', '      }')
          if source.count(old) != 1:
              raise SystemExit(f'German store block count: {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git add tests/product-contract.spec.ts
          git rm .github/workflows/product-contract-test-cleanup.yml
          git commit -m "Require German store label coverage"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run product contract regression tests
        run: npx playwright test tests/product-contract.spec.ts --project=desktop

      - name: Push sequential commits to main
        shell: bash
        run: |
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
