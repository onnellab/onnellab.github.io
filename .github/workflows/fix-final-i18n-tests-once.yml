name: Apply final localization test corrections

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct final test selectors
        run: python3 scripts/fix-final-i18n-tests.py
      - name: Commit test corrections
        run: |
          rm -f scripts/fix-final-i18n-tests.py
          rm -f .github/workflows/fix-final-i18n-tests-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: correct final localization assertions'
          git push origin HEAD:main
