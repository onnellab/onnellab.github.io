name: Apply remaining localization quality fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-remaining-localization-fixes.yml'

permissions:
  contents: write

concurrency:
  group: apply-remaining-localization-fixes-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure Git
        run: |
          git config user.name "ONNELLAB Automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Finish accessibility localization
        run: |
          git pull --rebase origin main
          node scripts/apply-remaining-localization-fixes.mjs accessibility
          npm run build
          npx playwright test tests/accessibility-i18n.spec.ts --project=desktop
          git add src tests .github/workflows/i18n-smoke.yml
          if ! git diff --cached --quiet; then
            git commit -m "Complete localized accessibility labels"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Correct confirmed language errors
        run: |
          git pull --rebase origin main
          node scripts/apply-remaining-localization-fixes.mjs corrections
          npm run build
          npx playwright test tests/papira-i18n.spec.ts tests/extended-i18n.spec.ts --project=desktop
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Correct confirmed translation errors"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Clarify privacy terminology
        run: |
          git pull --rebase origin main
          node scripts/apply-remaining-localization-fixes.mjs legal
          npm run build
          npx playwright test tests/site-i18n.spec.ts tests/extended-i18n.spec.ts tests/papira-i18n.spec.ts --project=desktop
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Clarify localized privacy terminology"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Rewrite public release notes
        run: |
          git pull --rebase origin main
          node scripts/apply-remaining-localization-fixes.mjs releases
          npm run build
          npx playwright test tests/product-contract.spec.ts --project=desktop
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Rewrite public release notes for users"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Normalize terminology and add quality guard
        run: |
          git pull --rebase origin main
          node scripts/apply-remaining-localization-fixes.mjs terminology
          npm run check:i18n-quality
          npm run build
          npx playwright test \
            tests/site-i18n.spec.ts \
            tests/accessibility-i18n.spec.ts \
            tests/extended-i18n.spec.ts \
            tests/papira-i18n.spec.ts \
            tests/product-contract.spec.ts \
            tests/site-visual.spec.ts \
            --project=desktop
          git add src tests scripts/check-localization-quality.mjs package.json .github/workflows/i18n-smoke.yml
          if ! git diff --cached --quiet; then
            git commit -m "Normalize localized terminology and guard quality"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Remove one-time migration
        run: |
          git pull --rebase origin main
          rm -f scripts/apply-remaining-localization-fixes.mjs .github/workflows/apply-remaining-localization-fixes.yml
          git add -u
          git commit -m "Remove one-time localization migration"
          git pull --rebase origin main
          git push origin HEAD:main
