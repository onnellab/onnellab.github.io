name: Finalize SEO description contract once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-seo-description-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Normalize product meta descriptions and lock regressions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_between(source: str, start_marker: str, end_marker: str, replacement: str, label: str) -> str:
              start = source.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker missing')
              end_start = source.find(end_marker, start)
              if end_start < 0:
                  raise SystemExit(f'{label}: end marker missing')
              end = end_start + len(end_marker)
              return source[:start] + replacement + source[end:]

          # Replace only the description generator and remove its obsolete article helper.
          p = Path('src/lib/products.ts')
          s = p.read_text()
          generator = r'''function seoPageDescription(source: ProductSource, copy: ProductCopy): string {
            const summary = pageDescription(copy).replace(/\s+/g, ' ').trim();
            const platforms = copy.locale === 'en'
              ? source.meta.platforms.join(' and ')
              : source.meta.platforms.join('/');
            const category = landingSubtitle(copy)
              .replace(/\s+/g, ' ')
              .trim()
              .replace(/[.!?。！？]+$/u, '');
            const normalize = (value: string) =>
              value.replace(/[.!?。！？]+$/u, '').trim().toLocaleLowerCase();
            const detail = normalize(summary) === normalize(category) ? '' : ` ${summary}`;

            if (copy.locale === 'ko') {
              return `${source.meta.title} — ${category}. 지원 플랫폼: ${platforms}.${detail}`;
            }
            if (copy.locale === 'ja') {
              return `${source.meta.title} — ${category}。対応プラットフォーム: ${platforms}。${detail}`;
            }
            if (copy.locale === 'zh-Hans') {
              return `${source.meta.title} — ${category}。支持平台：${platforms}。${detail}`;
            }
            if (copy.locale === 'zh-Hant') {
              return `${source.meta.title} — ${category}。支援平台：${platforms}。${detail}`;
            }
            if (copy.locale === 'pt-BR') {
              return `${source.meta.title} — ${category}. Plataformas: ${platforms}.${detail}`;
            }
            if (copy.locale === 'de') {
              return `${source.meta.title} — ${category}. Plattformen: ${platforms}.${detail}`;
            }
            if (copy.locale === 'fr') {
              return `${source.meta.title} — ${category}. Plateformes : ${platforms}.${detail}`;
            }
            if (copy.locale === 'es') {
              return `${source.meta.title} — ${category}. Plataformas: ${platforms}.${detail}`;
            }
            return `${source.meta.title} — ${category}. Platforms: ${platforms}.${detail}`;
          }

          '''
          s = replace_between(
              s,
              'function seoPageDescription(source: ProductSource, copy: ProductCopy): string {',
              'function productSeoTitle(source: ProductSource, copy: ProductCopy): string {',
              generator + 'function productSeoTitle(source: ProductSource, copy: ProductCopy): string {',
              'products description generator'
          )
          if 'function indefiniteArticle(' in s:
              s = replace_between(
                  s,
                  "function indefiniteArticle(value: string): 'a' | 'an' {",
                  'export function landingSubtitle(copy: ProductCopy): string {',
                  'export function landingSubtitle(copy: ProductCopy): string {',
                  'obsolete article helper'
              )
          p.write_text(s)

          # Lock the normal-app description format while preserving Papira's bespoke good copy.
          p = Path('tests/product-contract.spec.ts')
          s = p.read_text()
          if 'const metaPlatformMarkers =' not in s:
              locale_start = s.index('const locales = [')
              locale_end = s.index('] as const;', locale_start) + len('] as const;')
              marker_map = "\nconst metaPlatformMarkers = {\n  en: 'Platforms:',\n  ko: '지원 플랫폼:',\n  ja: '対応プラットフォーム:',\n  'zh-Hans': '支持平台：',\n  'zh-Hant': '支援平台：',\n  'pt-BR': 'Plataformas:',\n  de: 'Plattformen:',\n  fr: 'Plateformes :',\n  es: 'Plataformas:'\n} as const;"
              s = s[:locale_end] + marker_map + s[locale_end:]

          if 'const metaDescription = await page.locator' not in s:
              anchor = "      await expect(page.locator('link[rel=\"describedby\"]')).toHaveAttribute('href', 'https://onnellab.github.io/llms.txt');\n"
              if s.count(anchor) != 1:
                  raise SystemExit(f'product meta anchor count: {s.count(anchor)}')
              addition = "\n      const metaDescription = await page.locator('meta[name=\"description\"]').getAttribute('content');\n      expect(metaDescription).toBeTruthy();\n      if (app !== 'papira') {\n        expect(metaDescription).toContain(' — ');\n        expect(metaDescription).toContain(metaPlatformMarkers[locale.code]);\n      }\n"
              s = s.replace(anchor, anchor + addition, 1)

          if "expect(sitemap).not.toContain('<lastmod>');" not in s:
              anchor = "  const llmsResponse = await request.get('/llms.txt');\n"
              if s.count(anchor) != 1:
                  raise SystemExit(f'sitemap policy anchor count: {s.count(anchor)}')
              addition = "  const sitemapResponse = await request.get('/sitemap.xml');\n  expect(sitemapResponse.ok()).toBe(true);\n  const sitemap = await sitemapResponse.text();\n  expect(sitemap).not.toContain('<lastmod>');\n\n"
              s = s.replace(anchor, addition + anchor, 1)
          p.write_text(s)

          # Align Papira's old sitemap tests with the authoritative no-lastmod policy.
          p = Path('tests/papira-i18n.spec.ts')
          s = p.read_text()
          s = replace_between(
              s,
              '    for (const activeSource of [',
              "    expect(sitemapSource).not.toContain('commonLastmod');\n",
              '''    expect(sitemapSource).toContain("allLocalizedEntries('papira')");
            expect(sitemapSource).toContain('...productEntries()');
            expect(sitemapSource).toContain("{ lang: 'x-default', path: pathFor('en') }");
            expect(sitemapSource).not.toContain('lastmod');
            expect(sitemapSource).not.toContain('sourceFileLastmod');
            expect(sitemapSource).not.toContain('latestLastmod');
            expect(sitemapSource).not.toContain('corePageSources');
          ''',
              'Papira sitemap source contract'
          )
          s = replace_between(
              s,
              '    const papiraSourceFiles = [',
              '      expect(entry?.[1]).toBe(expectedLastmod);\n    }\n',
              "    expect(sitemap).not.toContain('<lastmod>');\n",
              'Papira sitemap lastmod contract'
          )
          p.write_text(s)
          PY

          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test tests/site-i18n.spec.ts tests/extended-i18n.spec.ts tests/papira-i18n.spec.ts tests/product-contract.spec.ts tests/site-visual.spec.ts --project=desktop

      - name: Commit verified SEO description patch
        shell: bash
        run: |
          rm -f .github/workflows/finalize-seo-description-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/products.ts tests/product-contract.spec.ts tests/papira-i18n.spec.ts .github/workflows/finalize-seo-description-once.yml
          git commit -m "fix: normalize product SEO metadata"
          git push origin main
