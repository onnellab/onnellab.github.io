name: Finalize SEO description contract once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-seo-description-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Normalize product meta descriptions and lock regressions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label} marker count: {count}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/lib/products.ts',
              r'''function seoPageDescription(source: ProductSource, copy: ProductCopy): string {
            const summary = pageDescription(copy).replace(/\s+/g, ' ').trim();
            const platforms = copy.locale === 'en'
              ? source.meta.platforms.join(' and ')
              : source.meta.platforms.join('/');
            const category = landingSubtitle(copy);
            if (copy.locale === 'ko') {
              return `${source.meta.title}는 ${platforms}용 ${category}입니다. ${summary}`;
            }
            if (copy.locale === 'ja') {
              return `${source.meta.title}は${platforms}向けの${category}です。${summary}`;
            }
            if (copy.locale === 'zh-Hans') {
              return `${source.meta.title} 是适用于 ${platforms} 的${category}。${summary}`;
            }
            if (copy.locale === 'zh-Hant') {
              return `${source.meta.title} 是適用於 ${platforms} 的${category}。${summary}`;
            }
            if (copy.locale === 'pt-BR') {
              return `${source.meta.title} é ${category} para ${platforms}. ${summary}`;
            }
            if (copy.locale === 'de') {
              return `${source.meta.title} ist ${category} für ${platforms}. ${summary}`;
            }
            if (copy.locale === 'fr') {
              return `${source.meta.title} est ${category} pour ${platforms}. ${summary}`;
            }
            if (copy.locale === 'es') {
              return `${source.meta.title} es ${category} para ${platforms}. ${summary}`;
            }
            return `${source.meta.title} is ${indefiniteArticle(category)} ${category} for ${platforms}. ${summary}`;
          }

          function productSeoTitle(source: ProductSource, copy: ProductCopy): string {
            const subtitle = landingSubtitle(copy).replace(/\s+/g, ' ').trim();
            if (!subtitle || subtitle.toLowerCase() === source.meta.title.toLowerCase()) {
              return source.meta.title;
            }
            return `${source.meta.title} - ${subtitle}`;
          }

          function indefiniteArticle(value: string): 'a' | 'an' {
            if (/^MP3\b/.test(value)) return 'an';
            return /^[aeiou]/i.test(value) ? 'an' : 'a';
          }
          ''',
              r'''function seoPageDescription(source: ProductSource, copy: ProductCopy): string {
            const summary = pageDescription(copy).replace(/\s+/g, ' ').trim();
            const platforms = copy.locale === 'en'
              ? source.meta.platforms.join(' and ')
              : source.meta.platforms.join('/');
            const category = landingSubtitle(copy)
              .replace(/\s+/g, ' ')
              .trim()
              .replace(/[.!?。！？]+$/u, '');
            const normalize = (value: string) =>
              value.replace(/[.!?。！？]+$/u, '').trim().toLocaleLowerCase();
            const detail = normalize(summary) === normalize(category) ? '' : ` ${summary}`;

            if (copy.locale === 'ko') {
              return `${source.meta.title} — ${category}. 지원 플랫폼: ${platforms}.${detail}`;
            }
            if (copy.locale === 'ja') {
              return `${source.meta.title} — ${category}。対応プラットフォーム: ${platforms}。${detail}`;
            }
            if (copy.locale === 'zh-Hans') {
              return `${source.meta.title} — ${category}。支持平台：${platforms}。${detail}`;
            }
            if (copy.locale === 'zh-Hant') {
              return `${source.meta.title} — ${category}。支援平台：${platforms}。${detail}`;
            }
            if (copy.locale === 'pt-BR') {
              return `${source.meta.title} — ${category}. Plataformas: ${platforms}.${detail}`;
            }
            if (copy.locale === 'de') {
              return `${source.meta.title} — ${category}. Plattformen: ${platforms}.${detail}`;
            }
            if (copy.locale === 'fr') {
              return `${source.meta.title} — ${category}. Plateformes : ${platforms}.${detail}`;
            }
            if (copy.locale === 'es') {
              return `${source.meta.title} — ${category}. Plataformas: ${platforms}.${detail}`;
            }
            return `${source.meta.title} — ${category}. Platforms: ${platforms}.${detail}`;
          }

          function productSeoTitle(source: ProductSource, copy: ProductCopy): string {
            const subtitle = landingSubtitle(copy).replace(/\s+/g, ' ').trim();
            if (!subtitle || subtitle.toLowerCase() === source.meta.title.toLowerCase()) {
              return source.meta.title;
            }
            return `${source.meta.title} - ${subtitle}`;
          }
          ''',
              'products description'
          )

          replace_once(
              'tests/product-contract.spec.ts',
              "] as const;\n\n// Keep schema descriptive and verifiable: no commerce/review claims, only real application semantics.",
              "] as const;\nconst metaPlatformMarkers = {\n  en: 'Platforms:',\n  ko: '지원 플랫폼:',\n  ja: '対応プラットフォーム:',\n  'zh-Hans': '支持平台：',\n  'zh-Hant': '支援平台：',\n  'pt-BR': 'Plataformas:',\n  de: 'Plattformen:',\n  fr: 'Plateformes :',\n  es: 'Plataformas:'\n} as const;\n\n// Keep schema descriptive and verifiable: no commerce/review claims, only real application semantics.",
              'test locale map'
          )

          replace_once(
              'tests/product-contract.spec.ts',
              "      await expect(page.locator('link[rel=\"describedby\"]')).toHaveAttribute('href', 'https://onnellab.github.io/llms.txt');\n",
              "      await expect(page.locator('link[rel=\"describedby\"]')).toHaveAttribute('href', 'https://onnellab.github.io/llms.txt');\n\n      const metaDescription = await page.locator('meta[name=\"description\"]').getAttribute('content');\n      expect(metaDescription).toBeTruthy();\n      if (app !== 'papira') {\n        expect(metaDescription).toContain(' — ');\n        expect(metaDescription).toContain(metaPlatformMarkers[locale.code]);\n      }\n",
              'test description contract'
          )

          replace_once(
              'tests/product-contract.spec.ts',
              "  const llmsResponse = await request.get('/llms.txt');\n",
              "  const sitemapResponse = await request.get('/sitemap.xml');\n  expect(sitemapResponse.ok()).toBe(true);\n  const sitemap = await sitemapResponse.text();\n  expect(sitemap).not.toContain('<lastmod>');\n\n  const llmsResponse = await request.get('/llms.txt');\n",
              'test sitemap policy'
          )

          replace_once(
              'tests/papira-i18n.spec.ts',
              '''    for (const activeSource of [
              'src/components/HomePage.astro',
              'src/components/AppsIndex.astro',
              'src/components/AboutPage.astro',
              'src/components/PrivacyIndex.astro',
              'src/components/CorePage.astro',
              'src/lib/papira.ts',
              'src/components/ProductTemplate.astro'
            ]) {
              expect(sitemapSource).toContain(activeSource);
            }
            expect(sitemapSource).toContain('latestLastmod(sourceLastmod, [corePageSources[page]');
            expect(sitemapSource).not.toContain('commonLastmod');
          ''',
              '''    expect(sitemapSource).toContain("allLocalizedEntries('papira')");
            expect(sitemapSource).toContain('...productEntries()');
            expect(sitemapSource).toContain("{ lang: 'x-default', path: pathFor('en') }");
            expect(sitemapSource).not.toContain('lastmod');
            expect(sitemapSource).not.toContain('sourceFileLastmod');
            expect(sitemapSource).not.toContain('latestLastmod');
            expect(sitemapSource).not.toContain('corePageSources');
          ''',
              'papira sitemap source contract'
          )

          replace_once(
              'tests/papira-i18n.spec.ts',
              '''
            const papiraSourceFiles = [
              'src/lib/papira.ts',
              'src/components/ProductTemplate.astro'
            ];
            const expectedLastmod = papiraSourceFiles
              .map((source) => fs.statSync(path.resolve(process.cwd(), source)).mtime)
              .sort((left, right) => left.getTime() - right.getTime())
              .at(-1)
              ?.toISOString()
              .slice(0, 10);
            expect(expectedLastmod).toBeTruthy();
            for (const locale of locales) {
              const productUrl = `https://onnellab.github.io/apps/papira/${locale.path}`;
              const entry = sitemap.match(new RegExp(`<loc>${productUrl}</loc>\\s*<lastmod>([^<]+)</lastmod>`));
              expect(entry?.[1]).toBe(expectedLastmod);
            }
          ''',
              '''
            expect(sitemap).not.toContain('<lastmod>');
          ''',
              'papira sitemap lastmod contract'
          )
          PY

          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test tests/site-i18n.spec.ts tests/extended-i18n.spec.ts tests/papira-i18n.spec.ts tests/product-contract.spec.ts tests/site-visual.spec.ts --project=desktop

      - name: Commit verified SEO description patch
        shell: bash
        run: |
          rm -f .github/workflows/finalize-seo-description-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/products.ts tests/product-contract.spec.ts tests/papira-i18n.spec.ts .github/workflows/finalize-seo-description-once.yml
          git commit -m "fix: normalize product SEO metadata"
          git push origin main
