name: Execute localization quality fixes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed wording fixes
        run: python3 scripts/i18n-quality-fixes.py

      - name: Commit quality fixes
        run: |
          rm -f scripts/i18n-quality-fixes.py
          rm -f .github/workflows/i18n-quality-once.yml
          rm -f .github/workflows/i18n-quality-run.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: polish translated copy and labels'
          git push origin HEAD:main
