name: One-time translation copy patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/translation-copy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure Git
        run: |
          git config user.name "ONNELLAB i18n patch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Polish Japanese home copy
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_value(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{label}: old value appears {text.count(old)} times')
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'{label}: expected value not found')
              path.write_text(text, encoding='utf-8')

          home = Path('src/components/HomePage.astro')
          replace_value(home,
              "seoTitle: 'ONNELLAB - ファイルと創作作業のためのアプリ',",
              "seoTitle: 'ONNELLAB - ファイル管理と創作のためのアプリ',",
              'Japanese home SEO title')
          replace_value(home,
              "title: '小さな道具を、 静かに。',",
              "title: '小さな道具を、静かに。',",
              'Japanese home heading')
          replace_value(home,
              '''<><span class="title-line">小さな道具を、</span>{' '}<span class="title-line">静かに。</span></>''',
              '''<><span class="title-line">小さな道具を、</span><span class="title-line">静かに。</span></>''',
              'Japanese split-heading separator')

          tests = Path('tests/site-i18n.spec.ts')
          replace_value(tests,
              "homeTitle: 'ONNELLAB - ファイルと創作作業のためのアプリ',",
              "homeTitle: 'ONNELLAB - ファイル管理と創作のためのアプリ',",
              'Japanese title fixture')
          replace_value(tests,
              "homeHeading: '小さな道具を、 静かに。',",
              "homeHeading: '小さな道具を、静かに。',",
              'Japanese heading fixture')
          PY
          git add src/components/HomePage.astro tests/site-i18n.spec.ts
          git commit -m "Polish Japanese home copy"

      - name: Refine localized metadata typography
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          products_path = Path('src/lib/products.ts')
          source = products_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"function seoPageDescription\(source: ProductSource, copy: ProductCopy\): string \{.*?\n\}\n\nfunction productSeoTitle",
              re.S)
          replacement = r'''function seoPageDescription(source: ProductSource, copy: ProductCopy): string {
            const summary = pageDescription(copy).replace(/\s+/g, ' ').trim();
            const platforms = copy.locale === 'en'
              ? source.meta.platforms.join(' and ')
              : source.meta.platforms.join('/');
            const category = landingSubtitle(copy)
              .replace(/\s+/g, ' ')
              .trim()
              .replace(/[.!?。！？]+$/u, '');
            const normalize = (value: string) =>
              value.replace(/[.!?。！？]+$/u, '').trim().toLocaleLowerCase();
            const detail = normalize(summary) === normalize(category) ? '' : summary;
            const spacedDetail = detail ? ` ${detail}` : '';

            if (copy.locale === 'ko') {
              return `${source.meta.title} — ${category}. 지원 플랫폼: ${platforms}.${spacedDetail}`;
            }
            if (copy.locale === 'ja') {
              return `${source.meta.title} — ${category}。対応プラットフォーム: ${platforms}。${detail}`;
            }
            if (copy.locale === 'zh-Hans') {
              return `${source.meta.title} — ${category}。支持平台：${platforms}。${detail}`;
            }
            if (copy.locale === 'zh-Hant') {
              return `${source.meta.title} — ${category}。支援平台：${platforms}。${detail}`;
            }
            if (copy.locale === 'pt-BR') {
              return `${source.meta.title} — ${category}. Plataformas: ${platforms}.${spacedDetail}`;
            }
            if (copy.locale === 'de') {
              return `${source.meta.title} — ${category}. Plattformen: ${platforms}.${spacedDetail}`;
            }
            if (copy.locale === 'fr') {
              return `${source.meta.title} — ${category}. Plateformes\u00A0: ${platforms}.${spacedDetail}`;
            }
            if (copy.locale === 'es') {
              return `${source.meta.title} — ${category}. Plataformas: ${platforms}.${spacedDetail}`;
            }
            return `${source.meta.title} — ${category}. Platforms: ${platforms}.${spacedDetail}`;
          }

          function productSeoTitle'''
          updated, count = pattern.subn(lambda _: replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'seoPageDescription: expected one function, found {count}')
          products_path.write_text(updated, encoding='utf-8')

          tests_path = Path('tests/product-contract.spec.ts')
          tests = tests_path.read_text(encoding='utf-8')
          old_marker = "  fr: 'Plateformes :',"
          if tests.count(old_marker) != 1:
              raise SystemExit(f'French marker appears {tests.count(old_marker)} times')
          tests = tests.replace(old_marker, "  fr: 'Plateformes\\u00A0:',", 1)
          assertion = "        expect(metaDescription).toContain(metaPlatformMarkers[locale.code]);"
          guarded = """        expect(metaDescription).toContain(metaPlatformMarkers[locale.code]);
                  if (locale.code === 'ja' || locale.code === 'zh-Hans' || locale.code === 'zh-Hant') {
                    expect(metaDescription).not.toMatch(/。[ \\t]/u);
                  }
                  if (locale.code === 'fr') {
                    expect(metaDescription).toContain('Plateformes\\u00A0:');
                    expect(metaDescription).not.toContain('Plateformes :');
                  }"""
          if tests.count(assertion) != 1:
              raise SystemExit(f'Metadata assertion appears {tests.count(assertion)} times')
          tests = tests.replace(assertion, guarded, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY
          git add src/lib/products.ts tests/product-contract.spec.ts
          git commit -m "Refine localized metadata typography"

      - name: Localize Portuguese and German store labels
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          template_path = Path('src/components/ProductTemplate.astro')
          lines = template_path.read_text(encoding='utf-8').splitlines()

          def patch_label(locale_token: str, old: str, new: str, label: str) -> None:
              matches = [
                  i for i, line in enumerate(lines)
                  if locale_token in line and 'download:' in line and 'stores:' in line and (old in line or new in line)
              ]
              if len(matches) != 1:
                  raise SystemExit(f'{label}: expected one localized label row, found {len(matches)}')
              index = matches[0]
              if old in lines[index]:
                  lines[index] = lines[index].replace(old, new, 1)

          patch_label("'pt-BR': {", "download:'Download'", "download:'Baixar'", 'Portuguese download')
          patch_label("  de: {", "stores:'Stores'", "stores:'App-Stores'", 'German stores')
          template_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          tests_path = Path('tests/product-contract.spec.ts')
          tests = tests_path.read_text(encoding='utf-8')
          marker = "      await expect(page.locator('.download-band')).toHaveCount(1);\n      await expect(page.locator('.site-footer')).toHaveCount(1);"
          guarded = """      await expect(page.locator('.download-band')).toHaveCount(1);
              if (locale.code === 'pt-BR') {
                await expect(page.locator('.download-band')).toHaveAttribute('aria-label', 'Baixar');
                await expect(page.locator('.download-band > .eyebrow')).toHaveText('Baixar');
              }
              if (locale.code === 'de') {
                const storeActions = page.locator('.download-band .actions.compact');
                if (await storeActions.count()) {
                  await expect(storeActions).toHaveAttribute('aria-label', 'App-Stores');
                }
              }
              await expect(page.locator('.site-footer')).toHaveCount(1);"""
          if tests.count(marker) != 1:
              raise SystemExit(f'Download assertion marker appears {tests.count(marker)} times')
          tests = tests.replace(marker, guarded, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY
          git add src/components/ProductTemplate.astro tests/product-contract.spec.ts
          git commit -m "Localize Portuguese and German store labels"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full visual and i18n regression suite
        run: npm run test:visual

      - name: Push sequential commits to main
        shell: bash
        run: |
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
