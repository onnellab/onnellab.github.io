name: One-time translation copy patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/translation-copy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure Git
        run: |
          git config user.name "ONNELLAB i18n patch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Fix Japanese home copy and regression fixture
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/components/HomePage.astro',
              "seoTitle: 'ONNELLAB - ファイルと創作作業のためのアプリ',",
              "seoTitle: 'ONNELLAB - ファイル管理と創作のためのアプリ',",
          )
          home = Path('src/components/HomePage.astro')
          home.write_text(
              home.read_text(encoding='utf-8').replace(
                  "title: '小さな道具を、 静かに。',",
                  "title: '小さな道具を、静かに。',",
              ),
              encoding='utf-8',
          )
          replace_once(
              'tests/site-i18n.spec.ts',
              "homeTitle: 'ONNELLAB - ファイルと創作作業のためのアプリ',",
              "homeTitle: 'ONNELLAB - ファイル管理と創作のためのアプリ',",
          )
          replace_once(
              'tests/site-i18n.spec.ts',
              "homeHeading: '小さな道具を、 静かに。',",
              "homeHeading: '小さな道具を、静かに。',",
          )
          PY
          git add src/components/HomePage.astro tests/site-i18n.spec.ts
          git commit -m "Polish Japanese home copy"

      - name: Fix CJK and French metadata typography
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}: {old!r}')
              return text.replace(old, new, 1)

          products_path = Path('src/lib/products.ts')
          products = products_path.read_text(encoding='utf-8')
          products = replace_once(
              products,
              "  const detail = normalize(summary) === normalize(category) ? '' : ` ${summary}`;",
              "  const detail = normalize(summary) === normalize(category) ? '' : summary;\n  const spacedDetail = detail ? ` ${detail}` : '';",
              'products.ts detail',
          )
          products = replace_once(products, "${platforms}.${detail}`;\n  }\n  if (copy.locale === 'ja')", "${platforms}.${spacedDetail}`;\n  }\n  if (copy.locale === 'ja')", 'products.ts ko')
          products = replace_once(products, "${platforms}.${detail}`;\n  }\n  if (copy.locale === 'de')", "${platforms}.${spacedDetail}`;\n  }\n  if (copy.locale === 'de')", 'products.ts pt-BR')
          products = replace_once(products, "${platforms}.${detail}`;\n  }\n  if (copy.locale === 'fr')", "${platforms}.${spacedDetail}`;\n  }\n  if (copy.locale === 'fr')", 'products.ts de')
          products = replace_once(
              products,
              "return `${source.meta.title} — ${category}. Plateformes : ${platforms}.${detail}`;",
              "return `${source.meta.title} — ${category}. Plateformes\\u00A0: ${platforms}.${spacedDetail}`;",
              'products.ts fr',
          )
          products = replace_once(products, "${platforms}.${detail}`;\n  }\n  return `${source.meta.title}", "${platforms}.${spacedDetail}`;\n  }\n  return `${source.meta.title}", 'products.ts es')
          products = replace_once(
              products,
              "return `${source.meta.title} — ${category}. Platforms: ${platforms}.${detail}`;",
              "return `${source.meta.title} — ${category}. Platforms: ${platforms}.${spacedDetail}`;",
              'products.ts en',
          )
          products_path.write_text(products, encoding='utf-8')

          test_path = Path('tests/product-contract.spec.ts')
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(tests, "  fr: 'Plateformes :',", "  fr: 'Plateformes\\u00A0:',", 'product test fr marker')
          assertion = "        expect(metaDescription).toContain(metaPlatformMarkers[locale.code]);"
          insertion = """        expect(metaDescription).toContain(metaPlatformMarkers[locale.code]);
                  if (locale.code === 'ja' || locale.code === 'zh-Hans' || locale.code === 'zh-Hant') {
                    expect(metaDescription).not.toMatch(/。[ \\t]/u);
                  }
                  if (locale.code === 'fr') {
                    expect(metaDescription).toContain('Plateformes\\u00A0:');
                    expect(metaDescription).not.toContain('Plateformes :');
                  }"""
          tests = replace_once(tests, assertion, insertion, 'product test metadata assertions')
          test_path.write_text(tests, encoding='utf-8')
          PY
          git add src/lib/products.ts tests/product-contract.spec.ts
          git commit -m "Refine localized metadata typography"

      - name: Localize Portuguese and German store labels
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}: {old!r}')
              return text.replace(old, new, 1)

          template_path = Path('src/components/ProductTemplate.astro')
          template = template_path.read_text(encoding='utf-8')
          template = replace_once(
              template,
              "download:'Download', screens:'Capturas de tela', stores:'Lojas'",
              "download:'Baixar', screens:'Capturas de tela', stores:'Lojas'",
              'Portuguese download label',
          )
          template = replace_once(
              template,
              "download:'Download', screens:'Screenshots', stores:'Stores'",
              "download:'Download', screens:'Screenshots', stores:'App-Stores'",
              'German store label',
          )
          template_path.write_text(template, encoding='utf-8')

          test_path = Path('tests/product-contract.spec.ts')
          tests = test_path.read_text(encoding='utf-8')
          marker = "      await expect(page.locator('.download-band')).toHaveCount(1);\n      await expect(page.locator('.site-footer')).toHaveCount(1);"
          replacement = """      await expect(page.locator('.download-band')).toHaveCount(1);
              if (locale.code === 'pt-BR') {
                await expect(page.locator('.download-band')).toHaveAttribute('aria-label', 'Baixar');
                await expect(page.locator('.download-band > .eyebrow')).toHaveText('Baixar');
              }
              if (locale.code === 'de') {
                const storeActions = page.locator('.download-band .actions.compact');
                if (await storeActions.count()) {
                  await expect(storeActions).toHaveAttribute('aria-label', 'App-Stores');
                }
              }
              await expect(page.locator('.site-footer')).toHaveCount(1);"""
          tests = replace_once(tests, marker, replacement, 'product test localized labels')
          test_path.write_text(tests, encoding='utf-8')
          PY
          git add src/components/ProductTemplate.astro tests/product-contract.spec.ts
          git commit -m "Localize Portuguese and German store labels"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full visual and i18n regression suite
        run: npm run test:visual

      - name: Push sequential commits to main
        shell: bash
        run: |
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
