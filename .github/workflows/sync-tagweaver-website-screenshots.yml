name: One-time TagWeaver website screenshot sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-tagweaver-website-screenshots.yml

permissions:
  contents: write

concurrency:
  group: tagweaver-website-screenshot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, onnellab-ai-coder]
    timeout-minutes: 30
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve latest TagWeaver main checkout
        id: source
        shell: bash
        env:
          SOURCE_REPOSITORY: https://github.com/onnellab/tagweaver.git
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0

          source_git=""
          source_ref=""
          candidates=(
            "/mnt/c/dev/projects/tagweaver"
            "/Users/gi/Documents/tagweaver"
            "/home/lue/dev/tagweaver"
            "/home/gi/dev/tagweaver"
            "/srv/onnellab/tagweaver"
            "${HOME}/tagweaver"
            "${HOME}/dev/tagweaver"
            "${HOME}/Documents/tagweaver"
          )

          for candidate in "${candidates[@]}"; do
            if git -C "$candidate" rev-parse --is-inside-work-tree >/dev/null 2>&1 &&
               git -C "$candidate" fetch --quiet origin main; then
              source_git="$candidate"
              source_ref="origin/main"
              break
            fi
          done

          if [[ -z "$source_git" ]]; then
            source_git="${RUNNER_TEMP}/tagweaver-source"
            rm -rf "$source_git"
            if ! git clone --quiet --filter=blob:none --no-tags "$SOURCE_REPOSITORY" "$source_git"; then
              rm -rf "$source_git"
              git clone --quiet --filter=blob:none --no-tags git@github.com:onnellab/tagweaver.git "$source_git"
            fi
            source_ref="origin/main"
          fi

          source_sha="$(git -C "$source_git" rev-parse "$source_ref")"
          test -n "$source_sha"
          echo "git_dir=$source_git" >> "$GITHUB_OUTPUT"
          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Using onnellab/tagweaver@$source_sha"

      - name: Replace all localized TagWeaver landing screenshots
        id: copy
        shell: bash
        env:
          SOURCE_GIT: ${{ steps.source.outputs.git_dir }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail

          git pull --rebase origin main

          target_root="src/content/apps/tagweaver/assets/screenshots"
          locales=(en ko ja zh-Hant zh-Hans pt-BR de fr es)
          copied=0

          for locale in "${locales[@]}"; do
            mkdir -p "$target_root/$locale"
            for index in 1 2 3 4 5 6; do
              printf -v source_name '%02d.png' "$index"
              source_path="assets/store_promo/generated/$locale/android/$source_name"
              target_path="$target_root/$locale/$index.png"
              git -C "$SOURCE_GIT" cat-file -e "$SOURCE_REF:$source_path"
              git -C "$SOURCE_GIT" show "$SOURCE_REF:$source_path" > "$target_path"
              test -s "$target_path"
              copied=$((copied + 1))
            done
          done

          [[ "$copied" -eq 54 ]]

          python3 - <<'PY'
          from pathlib import Path
          import struct

          root = Path('src/content/apps/tagweaver/assets/screenshots')
          locales = ['en', 'ko', 'ja', 'zh-Hant', 'zh-Hans', 'pt-BR', 'de', 'fr', 'es']
          files = [root / locale / f'{index}.png' for locale in locales for index in range(1, 7)]
          assert len(files) == 54
          for path in files:
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'Invalid PNG: {path}'
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == (1080, 2168), f'Unexpected dimensions for {path}: {width}x{height}'
          print(f'Validated {len(files)} PNG screenshots at 1080x2168.')
          PY

          changed_count="$(git diff --name-only -- "$target_root" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "changed_count=$changed_count" >> "$GITHUB_OUTPUT"
          echo "Copied 54 files; $changed_count differ from the website repository."

      - name: Build Astro site
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify production build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Commit screenshots and remove this one-time workflow
        id: commit
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          rm -f .github/workflows/sync-tagweaver-website-screenshots.yml
          git config user.name "ONNELLAB"
          git config user.email "akinstun21@gmail.com"
          git add src/content/apps/tagweaver/assets/screenshots .github/workflows/sync-tagweaver-website-screenshots.yml
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No repository changes remain."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit \
            -m "chore: sync TagWeaver promotional screenshots" \
            -m "Source: onnellab/tagweaver@${SOURCE_SHA}"
          git pull --rebase origin main
          git push origin HEAD:main
          commit_sha="$(git rev-parse HEAD)"
          echo "sha=$commit_sha" >> "$GITHUB_OUTPUT"

          {
            echo "## TagWeaver screenshot sync"
            echo "- Source: \`onnellab/tagweaver@${SOURCE_SHA}\`"
            echo "- Locales: 9"
            echo "- Screenshots validated: 54"
            echo "- Changed screenshot files: ${{ steps.copy.outputs.changed_count }}"
            echo "- Website commit: \`${commit_sha}\`"
            echo "- \`npm run build\`: passed"
          } >> "$GITHUB_STEP_SUMMARY"
