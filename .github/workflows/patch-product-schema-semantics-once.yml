name: Patch product schema semantics once

on:
  push:
    branches: [main]
    paths:
      - '.github/product-schema-semantics-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tighten SoftwareApplication semantics and regression contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          template_path = Path('src/components/ProductTemplate.astro')
          template = template_path.read_text(encoding='utf-8')
          template = replace_once(template, "const privacyUrl = new URL(privacyPath, Astro.site).toString();\n", "", 'privacyUrl declaration')
          old_store = "  ...(storeUrls.length > 0\n    ? { downloadUrl: storeUrls, installUrl: storeUrls, sameAs: storeUrls }\n    : {}),\n  softwareHelp: `mailto:${meta.supportEmail}`,\n  publisher: {\n"
          new_store = "  ...(storeUrls.length > 0\n    ? { installUrl: storeUrls, sameAs: storeUrls }\n    : {}),\n  publisher: {\n"
          template = replace_once(template, old_store, new_store, 'store and softwareHelp schema block')
          old_privacy = "    name: 'ONNELLAB',\n    url: new URL('/', Astro.site).toString()\n  },\n  privacyPolicy: privacyUrl\n};\n"
          new_privacy = "    name: 'ONNELLAB',\n    url: new URL('/', Astro.site).toString()\n  }\n};\n"
          template = replace_once(template, old_privacy, new_privacy, 'privacyPolicy schema field')
          template_path.write_text(template, encoding='utf-8')

          contract_path = Path('tests/product-contract.spec.ts')
          contract = contract_path.read_text(encoding='utf-8')
          classification_anchor = "const canonical = (route: string) => `https://onnellab.github.io${route}`;\n"
          classification_insert = (
              "const schemaClassifications: Record<string, { applicationCategory: string; applicationSubCategory: string }> = {\n"
              "  aligna: { applicationCategory: 'UtilitiesApplication', applicationSubCategory: 'File Renaming Utility' },\n"
              "  clipnest: { applicationCategory: 'UtilitiesApplication', applicationSubCategory: 'Clipboard Utility' },\n"
              "  melivra: { applicationCategory: 'MultimediaApplication', applicationSubCategory: 'Offline Music Player' },\n"
              "  meriq: { applicationCategory: 'DesignApplication', applicationSubCategory: 'Merchandise Production Tool' },\n"
              "  papira: { applicationCategory: 'DesignApplication', applicationSubCategory: 'EPUB Authoring Tool' },\n"
              "  quivra: { applicationCategory: 'MultimediaApplication', applicationSubCategory: 'Media Conversion Utility' },\n"
              "  segra: { applicationCategory: 'MultimediaApplication', applicationSubCategory: 'Audio Editing Utility' },\n"
              "  tagweaver: { applicationCategory: 'MultimediaApplication', applicationSubCategory: 'Audio Metadata Editor' },\n"
              "  vaultxt: { applicationCategory: 'UtilitiesApplication', applicationSubCategory: 'Large Text File Editor' }\n"
              "};\n\n"
              "const canonical = (route: string) => `https://onnellab.github.io${route}`;\n"
          )
          contract = replace_once(contract, classification_anchor, classification_insert, 'classification test map')
          old_assert = "      expect(software.publisher?.name).toBe('ONNELLAB');\n      expect(software.featureList?.length ?? 0).toBeGreaterThan(0);\n      expect(software).not.toHaveProperty('offers');\n"
          new_assert = "      expect(software.publisher?.name).toBe('ONNELLAB');\n      expect(software.featureList?.length ?? 0).toBeGreaterThan(0);\n      expect(schemaClassifications[app]).toBeTruthy();\n      expect(software.applicationCategory).toBe(schemaClassifications[app].applicationCategory);\n      expect(software.applicationSubCategory).toBe(schemaClassifications[app].applicationSubCategory);\n      expect(software).not.toHaveProperty('offers');\n"
          contract = replace_once(contract, old_assert, new_assert, 'classification assertions')
          old_absence = "      expect(software).not.toHaveProperty('isAccessibleForFree');\n      expect(await page.locator('.faq-band details').count()).toBeGreaterThanOrEqual(3);\n"
          new_absence = "      expect(software).not.toHaveProperty('isAccessibleForFree');\n      expect(software).not.toHaveProperty('downloadUrl');\n      expect(software).not.toHaveProperty('softwareHelp');\n      expect(software).not.toHaveProperty('privacyPolicy');\n      expect(await page.locator('.faq-band details').count()).toBeGreaterThanOrEqual(3);\n"
          contract = replace_once(contract, old_absence, new_absence, 'semantic absence assertions')
          old_static = "  expect(templateSource).not.toMatch(/\\bisAccessibleForFree\\s*:/);\n  expect(templateSource).not.toContain(\"'@type': 'FAQPage'\");\n"
          new_static = "  expect(templateSource).not.toMatch(/\\bisAccessibleForFree\\s*:/);\n  expect(templateSource).not.toMatch(/\\bdownloadUrl\\s*:/);\n  expect(templateSource).not.toMatch(/\\bsoftwareHelp\\s*:/);\n  expect(templateSource).not.toMatch(/\\bprivacyPolicy\\s*:/);\n  expect(templateSource).not.toContain(\"'@type': 'FAQPage'\");\n"
          contract = replace_once(contract, old_static, new_static, 'static schema guards')
          contract_path.write_text(contract, encoding='utf-8')

          papira_path = Path('tests/papira-i18n.spec.ts')
          papira = papira_path.read_text(encoding='utf-8')
          old_papira = "      expect(software).toMatchObject({\n        mainEntityOfPage: canonical,\n        privacyPolicy: `https://onnellab.github.io/privacy/papira/${locale.path}`,\n        softwareHelp: 'mailto:onnellab.app@gmail.com',\n        publisher: {\n"
          new_papira = "      expect(software).toMatchObject({\n        mainEntityOfPage: canonical,\n        applicationCategory: 'DesignApplication',\n        applicationSubCategory: 'EPUB Authoring Tool',\n        publisher: {\n"
          papira = replace_once(papira, old_papira, new_papira, 'Papira schema expectation')
          old_papira_absence = "      expect(software?.featureList).toHaveLength(5);\n      expect(schemas.some((item) => item['@type'] === 'BreadcrumbList')).toBe(true);\n"
          new_papira_absence = "      expect(software?.featureList).toHaveLength(5);\n      expect(software).not.toHaveProperty('downloadUrl');\n      expect(software).not.toHaveProperty('softwareHelp');\n      expect(software).not.toHaveProperty('privacyPolicy');\n      expect(schemas.some((item) => item['@type'] === 'BreadcrumbList')).toBe(true);\n"
          papira = replace_once(papira, old_papira_absence, new_papira_absence, 'Papira semantic absence expectations')
          papira_path.write_text(papira, encoding='utf-8')
          PY

          git diff --check
          npm ci
          npm run build

      - name: Commit schema semantics patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/product-schema-semantics-trigger .github/workflows/patch-product-schema-semantics-once.yml
          git add src/components/ProductTemplate.astro tests/product-contract.spec.ts tests/papira-i18n.spec.ts
          git commit -m 'fix: tighten product structured data semantics'
          git push origin HEAD:main
