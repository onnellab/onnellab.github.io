name: Patch product schema semantics once

on:
  push:
    branches: [main]
    paths:
      - '.github/product-schema-semantics-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tighten SoftwareApplication semantics and regression contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          template_path = Path('src/components/ProductTemplate.astro')
          template = template_path.read_text(encoding='utf-8')
          template = replace_once(
              template,
              "const privacyUrl = new URL(privacyPath, Astro.site).toString();\n",
              "",
              'privacyUrl declaration'
          )
          template = replace_once(
              template,
              """  ...(storeUrls.length > 0
    ? { downloadUrl: storeUrls, installUrl: storeUrls, sameAs: storeUrls }
    : {}),
  softwareHelp: `mailto:${meta.supportEmail}`,
  publisher: {
""",
              """  ...(storeUrls.length > 0
    ? { installUrl: storeUrls, sameAs: storeUrls }
    : {}),
  publisher: {
""",
              'store and softwareHelp schema block'
          )
          template = replace_once(
              template,
              """    name: 'ONNELLAB',
    url: new URL('/', Astro.site).toString()
  },
  privacyPolicy: privacyUrl
};
""",
              """    name: 'ONNELLAB',
    url: new URL('/', Astro.site).toString()
  }
};
""",
              'privacyPolicy schema field'
          )
          template_path.write_text(template, encoding='utf-8')

          contract_path = Path('tests/product-contract.spec.ts')
          contract = contract_path.read_text(encoding='utf-8')
          classification_anchor = """const canonical = (route: string) => `https://onnellab.github.io${route}`;
"""
          classification_insert = """const schemaClassifications: Record<string, { applicationCategory: string; applicationSubCategory: string }> = {
  aligna: { applicationCategory: 'UtilitiesApplication', applicationSubCategory: 'File Renaming Utility' },
  clipnest: { applicationCategory: 'UtilitiesApplication', applicationSubCategory: 'Clipboard Utility' },
  melivra: { applicationCategory: 'MultimediaApplication', applicationSubCategory: 'Offline Music Player' },
  meriq: { applicationCategory: 'DesignApplication', applicationSubCategory: 'Merchandise Production Tool' },
  papira: { applicationCategory: 'DesignApplication', applicationSubCategory: 'EPUB Authoring Tool' },
  quivra: { applicationCategory: 'MultimediaApplication', applicationSubCategory: 'Media Conversion Utility' },
  segra: { applicationCategory: 'MultimediaApplication', applicationSubCategory: 'Audio Editing Utility' },
  tagweaver: { applicationCategory: 'MultimediaApplication', applicationSubCategory: 'Audio Metadata Editor' },
  vaultxt: { applicationCategory: 'UtilitiesApplication', applicationSubCategory: 'Large Text File Editor' }
};

const canonical = (route: string) => `https://onnellab.github.io${route}`;
"""
          contract = replace_once(contract, classification_anchor, classification_insert, 'classification test map')
          contract = replace_once(
              contract,
              """      expect(software.publisher?.name).toBe('ONNELLAB');
      expect(software.featureList?.length ?? 0).toBeGreaterThan(0);
      expect(software).not.toHaveProperty('offers');
""",
              """      expect(software.publisher?.name).toBe('ONNELLAB');
      expect(software.featureList?.length ?? 0).toBeGreaterThan(0);
      expect(schemaClassifications[app]).toBeTruthy();
      expect(software.applicationCategory).toBe(schemaClassifications[app].applicationCategory);
      expect(software.applicationSubCategory).toBe(schemaClassifications[app].applicationSubCategory);
      expect(software).not.toHaveProperty('offers');
""",
              'classification assertions'
          )
          contract = replace_once(
              contract,
              """      expect(software).not.toHaveProperty('isAccessibleForFree');
      expect(await page.locator('.faq-band details').count()).toBeGreaterThanOrEqual(3);
""",
              """      expect(software).not.toHaveProperty('isAccessibleForFree');
      expect(software).not.toHaveProperty('downloadUrl');
      expect(software).not.toHaveProperty('softwareHelp');
      expect(software).not.toHaveProperty('privacyPolicy');
      expect(await page.locator('.faq-band details').count()).toBeGreaterThanOrEqual(3);
""",
              'semantic absence assertions'
          )
          contract = replace_once(
              contract,
              """  expect(templateSource).not.toMatch(/\bisAccessibleForFree\s*:/);
  expect(templateSource).not.toContain("'@type': 'FAQPage'");
""",
              """  expect(templateSource).not.toMatch(/\bisAccessibleForFree\s*:/);
  expect(templateSource).not.toMatch(/\bdownloadUrl\s*:/);
  expect(templateSource).not.toMatch(/\bsoftwareHelp\s*:/);
  expect(templateSource).not.toMatch(/\bprivacyPolicy\s*:/);
  expect(templateSource).not.toContain("'@type': 'FAQPage'");
""",
              'static schema guards'
          )
          contract_path.write_text(contract, encoding='utf-8')

          papira_path = Path('tests/papira-i18n.spec.ts')
          papira = papira_path.read_text(encoding='utf-8')
          papira = replace_once(
              papira,
              """      expect(software).toMatchObject({
        mainEntityOfPage: canonical,
        privacyPolicy: `https://onnellab.github.io/privacy/papira/${locale.path}`,
        softwareHelp: 'mailto:onnellab.app@gmail.com',
        publisher: {
""",
              """      expect(software).toMatchObject({
        mainEntityOfPage: canonical,
        applicationCategory: 'DesignApplication',
        applicationSubCategory: 'EPUB Authoring Tool',
        publisher: {
""",
              'Papira schema expectation'
          )
          papira = replace_once(
              papira,
              """      expect(software?.featureList).toHaveLength(5);
      expect(schemas.some((item) => item['@type'] === 'BreadcrumbList')).toBe(true);
""",
              """      expect(software?.featureList).toHaveLength(5);
      expect(software).not.toHaveProperty('downloadUrl');
      expect(software).not.toHaveProperty('softwareHelp');
      expect(software).not.toHaveProperty('privacyPolicy');
      expect(schemas.some((item) => item['@type'] === 'BreadcrumbList')).toBe(true);
""",
              'Papira semantic absence expectations'
          )
          papira_path.write_text(papira, encoding='utf-8')
          PY

          git diff --check
          npm ci
          npm run build

      - name: Commit schema semantics patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/product-schema-semantics-trigger .github/workflows/patch-product-schema-semantics-once.yml
          git add src/components/ProductTemplate.astro tests/product-contract.spec.ts tests/papira-i18n.spec.ts
          git commit -m 'fix: tighten product structured data semantics'
          git push origin HEAD:main
