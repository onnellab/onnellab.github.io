name: One-time mark TagWeaver 2.3 as submitted

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-mark-tagweaver-2-3-submitted.yml

permissions:
  contents: write

concurrency:
  group: one-time-mark-tagweaver-2-3-submitted
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add submitted-store status to the 2.3 note
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          release_path = Path('src/lib/releaseNotes.ts')
          core_page_path = Path('src/components/ReleaseNoteTemplate.astro')
          extended_page_path = Path('src/components/ExtendedReleaseNotePage.astro')

          release = release_path.read_text(encoding='utf-8')
          type_old = "  internalGitHubUrl: string;\n};"
          type_new = "  internalGitHubUrl: string;\n  storeStatus?: 'submitted' | 'published';\n};"
          if release.count(type_old) != 1:
              raise SystemExit(f'expected one ReleaseNote type marker, found {release.count(type_old)}')
          release = release.replace(type_old, type_new, 1)

          entry_pattern = re.compile(
              r"  \{\n  appSlug: 'tagweaver',\n  appName: 'TagWeaver',\n  version: '2\.3',.*?\n\},\n(?=  \{\n    appSlug: 'clipnest')",
              re.S,
          )
          entry = """  {
            appSlug: 'tagweaver',
            appName: 'TagWeaver',
            version: '2.3',
            tag: 'v2.3.0',
            platform: 'iOS · Android',
            releasedDate: '2026-08-27',
            title: 'TagWeaver v2.3',
            summary: 'Release notes for the TagWeaver 2.3 update submitted for review on iOS and Android.',
            summaryKo: 'iOS와 Android 스토어 심사에 제출한 TagWeaver 2.3 업데이트의 공용 릴리즈 노트예요.',
            previousVersion: '2.2.2',
            internalGitHubUrl: 'https://github.com/onnellab/tagweaver/commit/b58791c056bf811cb30bc9fe32966901a9f39202',
            storeStatus: 'submitted',
            changes: [
              'Fixed an issue where FLAC cover images might not be saved.',
              'Fixed minor issues and added 7 languages, bringing support to 9 languages in total.'
            ],
            changesKo: [
              'FLAC 파일의 커버 이미지가 저장되지 않을 수 있던 문제를 해결했어요.',
              '사소한 오류를 수정하고 7개 언어를 추가해 총 9개 언어를 지원해요.'
            ]
          },
"""
          release, count = entry_pattern.subn(entry, release, count=1)
          if count != 1:
              raise SystemExit(f'expected one TagWeaver 2.3 entry, replaced {count}')
          release_path.write_text(release, encoding='utf-8')

          core_page = core_page_path.read_text(encoding='utf-8')
          props_marker = "const { note, locale } = Astro.props;\nconst isKo = locale === 'ko';"
          props_replacement = "const { note, locale } = Astro.props;\nconst isKo = locale === 'ko';\nconst isSubmitted = note.storeStatus === 'submitted';"
          if core_page.count(props_marker) != 1:
              raise SystemExit(f'expected one core props marker, found {core_page.count(props_marker)}')
          core_page = core_page.replace(props_marker, props_replacement, 1)

          labels_pattern = re.compile(r"const labels = isKo\n.*?\n\nconst releasePathFor", re.S)
          labels_block = """const labels = isKo
            ? isSubmitted
              ? {
                  titleSuffix: '릴리즈 노트',
                  eyebrow: '릴리즈 노트',
                  released: '웹 게시일',
                  platform: '플랫폼',
                  previous: '이전 공개 버전',
                  changed: '변경 사항',
                  compatibility: '스토어 공개 상태',
                  compatibilityText: '이 업데이트는 iOS와 Android 스토어 심사에 제출됐어요. 각 스토어의 승인이 끝난 뒤 순차적으로 공개돼요.',
                  upgrade: '업데이트 안내',
                  upgradeText: '스토어에서 2.3이 공개된 뒤 일반 업데이트와 같은 방식으로 설치할 수 있어요.',
                  appPage: '앱 페이지'
                }
              : {
                  titleSuffix: '릴리즈 노트',
                  eyebrow: '릴리즈 노트',
                  released: '출시일',
                  platform: '플랫폼',
                  previous: '이전 공개 버전',
                  changed: '변경 사항',
                  compatibility: '호환성',
                  compatibilityText: `이 업데이트는 ${note.appName}의 공개 앱 스토어 목록을 통해 배포됩니다.`,
                  upgrade: '업데이트 안내',
                  upgradeText: '별도의 업데이트 절차는 필요하지 않습니다.',
                  appPage: '앱 페이지'
                }
            : isSubmitted
              ? {
                  titleSuffix: 'Release Notes',
                  eyebrow: 'Release Notes',
                  released: 'Published on the web',
                  platform: 'Platform',
                  previous: 'Previous public version',
                  changed: 'What Changed',
                  compatibility: 'Store availability',
                  compatibilityText: 'This update has been submitted for review on iOS and Android. It will become available in each store after approval.',
                  upgrade: 'Upgrade Notes',
                  upgradeText: 'Once version 2.3 is available in your store, it can be installed as a regular update.',
                  appPage: 'App page'
                }
              : {
                  titleSuffix: 'Release Notes',
                  eyebrow: 'Release Notes',
                  released: 'Released',
                  platform: 'Platform',
                  previous: 'Previous public version',
                  changed: 'What Changed',
                  compatibility: 'Compatibility',
                  compatibilityText: `This update is distributed through the public app store listing for ${note.appName}.`,
                  upgrade: 'Upgrade Notes',
                  upgradeText: 'No special upgrade steps are required.',
                  appPage: 'App page'
                };

          const releasePathFor"""
          core_page, count = labels_pattern.subn(labels_block, core_page, count=1)
          if count != 1:
              raise SystemExit(f'expected one core labels block, replaced {count}')
          core_page_path.write_text(core_page, encoding='utf-8')

          extended_page = extended_page_path.read_text(encoding='utf-8')
          extended_marker = "const text = getExtendedReleaseCopy(note, locale);\nconst labels = releaseLabels[locale];\nconst definition = allLocaleDefinitions[locale];"
          submitted_block = """const text = getExtendedReleaseCopy(note, locale);
          const submittedLabels: Record<ReleaseLocale, {
            released: string;
            compatibility: string;
            compatibilityText: (app: string) => string;
            upgrade: string;
            upgradeText: string;
          }> = {
            ja: {
              released: 'ウェブ掲載日',
              compatibility: 'ストア公開状況',
              compatibilityText: () => 'このアップデートは iOS と Android の審査に提出済みです。各ストアで承認され次第、順次公開されます。',
              upgrade: 'アップデートについて',
              upgradeText: 'ストアでバージョン2.3が公開された後、通常のアップデートとしてインストールできます。'
            },
            'zh-Hans': {
              released: '网页发布日期',
              compatibility: '商店上架状态',
              compatibilityText: () => '此更新已提交 iOS 和 Android 审核，将在各商店审核通过后陆续上架。',
              upgrade: '更新说明',
              upgradeText: '2.3 版本在商店上架后，可按常规方式更新。'
            },
            'zh-Hant': {
              released: '網頁發布日',
              compatibility: '商店上架狀態',
              compatibilityText: () => '此更新已提交 iOS 與 Android 審核，將在各商店審核通過後陸續上架。',
              upgrade: '更新說明',
              upgradeText: '2.3 版本在商店上架後，可依一般方式更新。'
            },
            'pt-BR': {
              released: 'Publicação no site',
              compatibility: 'Status nas lojas',
              compatibilityText: () => 'Esta atualização foi enviada para análise no iOS e no Android. Ela será disponibilizada em cada loja após a respectiva aprovação.',
              upgrade: 'Como atualizar',
              upgradeText: 'Quando a versão 2.3 estiver disponível na sua loja, ela poderá ser instalada como uma atualização normal.'
            },
            de: {
              released: 'Web-Veröffentlichung',
              compatibility: 'Store-Status',
              compatibilityText: () => 'Dieses Update wurde für iOS und Android zur Prüfung eingereicht. Es wird in jedem Store nach der jeweiligen Freigabe veröffentlicht.',
              upgrade: 'Update-Hinweise',
              upgradeText: 'Sobald Version 2.3 in deinem Store verfügbar ist, kann sie wie ein normales Update installiert werden.'
            },
            fr: {
              released: 'Publication sur le site',
              compatibility: 'Disponibilité dans les stores',
              compatibilityText: () => 'Cette mise à jour a été soumise à validation sur iOS et Android. Elle sera publiée dans chaque boutique après approbation.',
              upgrade: 'Mise à jour',
              upgradeText: 'Lorsque la version 2.3 sera disponible dans votre boutique, elle pourra être installée comme une mise à jour normale.'
            },
            es: {
              released: 'Publicación en la web',
              compatibility: 'Estado en las tiendas',
              compatibilityText: () => 'Esta actualización se ha enviado a revisión para iOS y Android. Se publicará en cada tienda cuando reciba la aprobación correspondiente.',
              upgrade: 'Cómo actualizar',
              upgradeText: 'Cuando la versión 2.3 esté disponible en tu tienda, podrás instalarla como una actualización normal.'
            }
          };
          const labels = note.storeStatus === 'submitted'
            ? { ...releaseLabels[locale], ...submittedLabels[locale] }
            : releaseLabels[locale];
          const definition = allLocaleDefinitions[locale];"""
          if extended_page.count(extended_marker) != 1:
              raise SystemExit(f'expected one extended marker, found {extended_page.count(extended_marker)}')
          extended_page = extended_page.replace(extended_marker, submitted_block, 1)
          extended_page_path.write_text(extended_page, encoding='utf-8')

          checks = {
              release_path: ["storeStatus?: 'submitted' | 'published'", "storeStatus: 'submitted'"],
              core_page_path: ['웹 게시일', 'Store availability'],
              extended_page_path: ['ウェブ掲載日', '网页发布日期', '網頁發布日', 'Publicação no site', 'Web-Veröffentlichung', 'Publication sur le site', 'Publicación en la web'],
          }
          for path, expected in checks.items():
              text = path.read_text(encoding='utf-8')
              for item in expected:
                  if text.count(item) != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {item!r}, found {text.count(item)}')

          print('Marked TagWeaver 2.3 as submitted and added review-aware labels in nine languages.')
          PY

          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate localization and production build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check:i18n-quality
          npm run build

      - name: Commit status-aware release notes and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-mark-tagweaver-2-3-submitted.yml
          git config user.name "ONNELLAB"
          git config user.email "akinstun21@gmail.com"
          git add src/lib/releaseNotes.ts src/components/ReleaseNoteTemplate.astro src/components/ExtendedReleaseNotePage.astro .github/workflows/one-time-mark-tagweaver-2-3-submitted.yml
          git diff --cached --check
          git commit -m "docs: mark TagWeaver 2.3 as under review" -m "Publish a common nine-language web note without implying store approval."
          git pull --rebase origin main
          git push origin HEAD:main
