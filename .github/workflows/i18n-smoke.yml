# Permanent localization quality gate for all nine supported languages.
name: Verify nine-language site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/i18n-smoke.yml'
      - 'src/**'
      - 'public/privacy/**'
      - 'tests/**'
      - 'scripts/check-localization-quality.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
  pull_request:
    paths:
      - '.github/workflows/i18n-smoke.yml'
      - 'src/**'
      - 'public/privacy/**'
      - 'tests/**'
      - 'scripts/check-localization-quality.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: i18n-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check localization quality
        run: npm run check:i18n-quality

      - name: Build site
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run site i18n regression tests
        run: npx playwright test tests/site-i18n.spec.ts --project=desktop --reporter=line,html

      - name: Run extended i18n regression tests
        run: npx playwright test tests/extended-i18n.spec.ts --project=desktop --reporter=line,html

      - name: Run release note localization regression tests
        run: npx playwright test tests/release-notes-i18n.spec.ts --project=desktop --reporter=line,html

      - name: Run Papira i18n regression tests
        run: npx playwright test tests/papira-i18n.spec.ts --project=desktop --reporter=line,html

      - name: Run product contract regression tests
        run: npx playwright test tests/product-contract.spec.ts --project=desktop --reporter=line,html

      - name: Run localized accessibility regression tests
        run: npx playwright test tests/accessibility-i18n.spec.ts --project=desktop --reporter=line,html

      - name: Run localized copy regression tests
        run: npx playwright test tests/localization-copy.spec.ts --project=desktop --reporter=line,html

      - name: Run site visual regression tests
        run: npx playwright test tests/site-visual.spec.ts --project=desktop --reporter=line,html

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-playwright-failure-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_RESULT" = "success" ]; then
            state=success
            description="Nine-language localization regression tests passed"
          else
            state=failure
            description="Nine-language localization regression tests failed"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="onnellab/i18n-smoke" \
            -f description="$description" \
            -f target_url="$TARGET_URL"
