name: Apply ordered localization review fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-localization-review.yml'

permissions:
  contents: write

concurrency:
  group: apply-localization-review-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure Git
        run: |
          git config user.name "ONNELLAB Automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Consolidate the one-time migration
        run: |
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/apply-localization-review.mjs')
          lines = script.read_text(encoding='utf-8').splitlines()
          fixed = False
          for index, line in enumerate(lines):
              if 'Hicimos más fiable la edición habitual de etiquetas.' in line and not line.rstrip().endswith(']'):
                  lines[index] = line + ']'
                  fixed = True
          script.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          if not fixed:
              print('Release-note replacement array was already syntactically complete.')

          for stale in (
              Path('scripts/apply-remaining-localization-fixes.mjs'),
              Path('.github/workflows/apply-remaining-localization-fixes.yml'),
          ):
              stale.unlink(missing_ok=True)
          PY
          node --check scripts/apply-localization-review.mjs
          git add -A scripts .github/workflows/apply-remaining-localization-fixes.yml
          if ! git diff --cached --quiet; then
            git commit -m "Consolidate localization repair tooling"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Localize accessibility metadata
        run: |
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/ExtendedSitePage.astro')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              "<small>{item.platforms.join(' · ')}</small>",
              "<small class=\"platform-badges\" aria-label={copy.common.platforms}>{item.platforms.join(' · ')}</small>",
          )
          path.write_text(source, encoding='utf-8')
          PY
          node scripts/apply-localization-review.mjs accessibility
          npm run build
          npx playwright test tests/accessibility-i18n.spec.ts --project=desktop
          git add src tests .github/workflows/i18n-smoke.yml
          if ! git diff --cached --quiet; then
            git commit -m "Complete accessibility localization across nine languages"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Correct confirmed language errors
        run: |
          git pull --rebase origin main
          node scripts/apply-localization-review.mjs corrections
          npm run build
          npx playwright test tests/papira-i18n.spec.ts tests/extended-i18n.spec.ts --project=desktop
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Correct confirmed localization errors"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Clarify privacy and purchase terminology
        run: |
          git pull --rebase origin main
          node scripts/apply-localization-review.mjs legal
          npm run build
          npx playwright test tests/site-i18n.spec.ts tests/extended-i18n.spec.ts tests/papira-i18n.spec.ts --project=desktop
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Clarify localized privacy and purchase terminology"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Rewrite public release notes
        run: |
          git pull --rebase origin main
          node scripts/apply-localization-review.mjs release
          npm run build
          npx playwright test tests/product-contract.spec.ts --project=desktop
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Rewrite public release notes for users"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Normalize terminology and add a quality gate
        run: |
          git pull --rebase origin main
          node scripts/apply-localization-review.mjs terminology
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/i18n-smoke.yml')
          source = workflow.read_text(encoding='utf-8')
          source = source.replace("      - 'scripts/check-localization-quality.mjs'\n", '')
          source = source.replace(
              "      - 'package.json'\n",
              "      - 'package.json'\n      - 'scripts/check-localization-quality.mjs'\n",
              2,
          )
          workflow.write_text(source, encoding='utf-8')
          PY
          npm run check:i18n-quality
          npm run build
          npx playwright test \
            tests/site-i18n.spec.ts \
            tests/accessibility-i18n.spec.ts \
            tests/extended-i18n.spec.ts \
            tests/papira-i18n.spec.ts \
            tests/product-contract.spec.ts \
            tests/site-visual.spec.ts \
            --project=desktop
          git add src tests scripts/check-localization-quality.mjs package.json .github/workflows/i18n-smoke.yml
          if ! git diff --cached --quiet; then
            git commit -m "Normalize localized terminology and guard quality"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Remove one-time migration tooling
        run: |
          git pull --rebase origin main
          rm -f scripts/apply-localization-review.mjs .github/workflows/apply-localization-review.yml
          git add -u
          git commit -m "Remove one-time localization repair tooling"
          git pull --rebase origin main
          git push origin HEAD:main
