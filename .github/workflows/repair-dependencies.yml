name: Repair and verify dependencies

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-dependencies.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record the existing blog fixture failure before changing dependencies
        run: |
          npm ci --ignore-scripts --no-audit
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          assert.equal(lock.packages['node_modules/astro'].version, '7.0.4');
          const result = spawnSync('npm', ['run', 'test:blog-template'], { encoding: 'utf8', timeout: 120000 });
          const output = (result.stdout ?? '') + (result.stderr ?? '');
          fs.writeFileSync('/tmp/blog-template-before.log', output);
          assert.equal(result.status, 1, 'Baseline test outcome changed; investigate before proceeding');
          assert.match(output, /Missing localized source: src\/content\/blog\/ko\/template-contract\.md/);
          assert.match(output, /# fail 2/);
          console.log('BASELINE: Astro 7.0.4 reproduces two blog fixture failures: missing Korean template-contract.md.');
          console.log('No production content or test assertions will be altered by this dependency patch.');
          NODE
      - name: Raise the verified Astro floor and update compatible transitive packages
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          assert.equal(pkg.dependencies.astro, '^7.0.4');
          fs.writeFileSync('/tmp/dependency-lock-before.json', JSON.stringify(lock));
          pkg.dependencies.astro = '^7.3.3';
          pkg.scripts['audit:security'] = 'npm audit --package-lock-only --include=dev --audit-level=high';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          npm update astro js-yaml nanoid postcss sharp smol-toml svgo --package-lock-only --ignore-scripts
      - name: Require zero known vulnerabilities across the complete lockfile
        run: npm audit --package-lock-only --include=dev --audit-level=low --json > /tmp/dependency-audit-after.json
      - name: Reinstall from the patched lockfile
        run: npm ci
      - name: Report versions and dependency ancestry
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before = JSON.parse(fs.readFileSync('/tmp/dependency-lock-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const name of ['astro','js-yaml','nanoid','postcss','sharp','smol-toml','svgo','@playwright/test']) {
            console.log(JSON.stringify({ package: name, before: before.packages['node_modules/'+name]?.version, after: after.packages['node_modules/'+name]?.version }));
          }
          console.log(fs.readFileSync('/tmp/dependency-audit-after.json','utf8'));
          NODE
          npm ls astro js-yaml nanoid postcss sharp smol-toml svgo @playwright/test
      - name: Confirm the unrelated fixture failure has the same cause after the update
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          const result = spawnSync('npm', ['run', 'test:blog-template'], { encoding: 'utf8', timeout: 120000 });
          const output = (result.stdout ?? '') + (result.stderr ?? '');
          fs.writeFileSync('/tmp/blog-template-after.log', output);
          assert.equal(result.status, 1);
          assert.match(output, /Missing localized source: src\/content\/blog\/ko\/template-contract\.md/);
          assert.match(output, /# fail 2/);
          const causes = value => [...value.matchAll(/Missing localized source: ([^\s\u001b]+)/g)].map(match => match[1]);
          assert.deepEqual([...new Set(causes(output))], [...new Set(causes(fs.readFileSync('/tmp/blog-template-before.log','utf8')))]);
          console.log('::warning::Existing blog-template tests fail identically before and after: temporary English-only fixtures violate the sitemap locale contract. This is not counted as a test pass.');
          NODE
      - name: Check localization quality and rebuild clean production pages
        run: |
          npm run check:i18n-quality
          npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify page content, routes, localization and accessibility
        run: npx playwright test tests/meriq-copy.spec.ts tests/product-contract.spec.ts tests/extended-i18n.spec.ts tests/site-i18n.spec.ts tests/accessibility-i18n.spec.ts --project=desktop --workers=2 --reporter=line
      - name: Check static output and strictly limited change scope
        run: |
          test -f dist/apps/meriq/index.html
          test ! -d dist/server
          git diff --check
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const paths = execFileSync('git', ['diff','--name-only'], {encoding:'utf8'}).trim().split('\n');
          assert.deepEqual(paths.sort(), ['package-lock.json','package.json']);
          assert.equal(execFileSync('git',['ls-files','--others','--exclude-standard','src','public'],{encoding:'utf8'}).trim(), '');
          console.log('Scope verified: only package.json and package-lock.json changed; no test fixtures or production content were added.');
          NODE
      - name: Commit and push verified dependency patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(security): upgrade Astro and vulnerable transitive dependencies'
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$header"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $header"
          trap 'git config --local --unset-all http.https://github.com/.extraheader' EXIT
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Retain audit and baseline comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-${{ github.run_id }}
          path: |
            /tmp/dependency-audit-after.json
            /tmp/blog-template-before.log
            /tmp/blog-template-after.log
            test-results
          retention-days: 14
          if-no-files-found: ignore
