name: One-time sync Papira screenshot alt tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-sync-papira-alt-tests.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align Papira screenshot expectations with audited copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/papira-i18n.spec.ts')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '作品種類の選択画面、表紙と本文の設定': 'Papiraの作品種類選択画面で、表紙と本文を設定',
              '表紙・目次・本の情報を確認するPapiraのプレビュー': 'Papiraで表紙・目次・本の情報を確認するプレビュー画面',
              '章タイトルの検出と目次プレビュー': 'Papiraの章タイトル検出と目次プレビュー画面',
              'EPUBを書き出して端末に保存する画面': 'PapiraでEPUBを書き出して端末に保存する画面',
              '作品类型选择，设置封面与正文': 'Papira 作品类型选择界面，用于设置封面与正文',
              '电子书预览，查看封面、目录和书籍信息': 'Papira 电子书预览界面，用于查看封面、目录和书籍信息',
              '章节识别与目录预览': 'Papira 章节识别与目录预览界面',
              '导出 EPUB 并保存到设备': 'Papira EPUB 导出界面，用于保存到设备',
              '作品類型選擇，設定封面與內文': 'Papira 作品類型選擇畫面，用於設定封面與內文',
              '電子書預覽，查看封面、目錄與書籍資訊': 'Papira 電子書預覽畫面，用於查看封面、目錄與書籍資訊',
              '章節辨識與目錄預覽': 'Papira 章節辨識與目錄預覽畫面',
              '匯出 EPUB 並儲存到裝置': 'Papira EPUB 匯出畫面，用於儲存到裝置',
              'Escolha do tipo de obra, capa e estrutura do texto': 'Tela do Papira para escolher o tipo de obra, a capa e a estrutura do texto',
              'Prévia do livro com capa, sumário e dados': 'Prévia do Papira com capa, sumário e dados do livro',
              'Detecção de capítulos e prévia do sumário': 'Tela do Papira com detecção de capítulos e prévia do sumário',
              'Exportação do EPUB para salvar no dispositivo': 'Tela do Papira para exportar o EPUB e salvá-lo no dispositivo',
              'Auswahl des Werktyps mit Cover- und Textaufbau': 'Papira-Auswahl des Werktyps mit Cover- und Textaufbau',
              'Buchvorschau mit Cover, Inhaltsverzeichnis und Buchdaten': 'Papira-Buchvorschau mit Cover, Inhaltsverzeichnis und Buchdaten',
              'Kapitelerkennung und Inhaltsverzeichnis-Vorschau': 'Papira-Kapitelerkennung mit Vorschau des Inhaltsverzeichnisses',
              'EPUB-Export zum Speichern auf dem Gerät': 'Papira-EPUB-Export zum Speichern auf dem Gerät',
              'Choix du type de texte, de la couverture et de la structure': 'Écran Papira pour choisir le type de texte, la couverture et la structure',
              'Aperçu du livre avec couverture, sommaire et informations': 'Aperçu Papira du livre avec couverture, sommaire et informations',
              'Détection des chapitres et aperçu du sommaire': 'Écran Papira de détection des chapitres et d’aperçu du sommaire',
              'Exportation de l’EPUB vers l’appareil': 'Écran Papira d’exportation de l’EPUB vers l’appareil',
              'Elección del tipo de obra, portada y estructura del texto': 'Pantalla de Papira para elegir el tipo de obra, la portada y la estructura del texto',
              'Vista previa del libro con portada, índice y datos': 'Vista previa de Papira con portada, índice y datos del libro',
              'Detección de capítulos y vista previa del índice': 'Pantalla de Papira para detectar capítulos y previsualizar el índice',
              'Exportación del EPUB para guardarlo en el dispositivo': 'Pantalla de Papira para exportar el EPUB y guardarlo en el dispositivo',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/one-time-sync-papira-alt-tests.yml
          git config user.name ONNELLAB
          git config user.email akinstun21@gmail.com
          git add tests/papira-i18n.spec.ts .github/workflows/one-time-sync-papira-alt-tests.yml
          git commit -m "Align Papira screenshot alt regression copy"
          git pull --rebase origin main
          git push origin HEAD:main
