name: Upgrade static privacy pages to nine languages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade static privacy pages
        run: python3 scripts/upgrade-static-privacy-i18n.py

      - name: Commit privacy navigation upgrade
        run: |
          rm -f scripts/upgrade-static-privacy-i18n.py
          rm -f .github/workflows/static-privacy-i18n-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: expose all nine languages on app privacy pages'
          git push origin HEAD:main
