name: Final nine-language localization audit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify localization source parity and reviewed fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          locales = ['en','ko','ja','zh-Hans','zh-Hant','pt-BR','de','fr','es']
          root = Path('src/content/blog')
          expected = sorted(p.name for p in (root / 'en').glob('*.md'))
          assert len(expected) == 9, f'expected 9 English blog posts, found {len(expected)}'
          for locale in locales:
              actual = sorted(p.name for p in (root / locale).glob('*.md'))
              assert actual == expected, f'blog parity mismatch for {locale}: {actual}'

          product = Path('src/components/ProductTemplate.astro').read_text()
          for marker in [
              'releaseNoteKoPath',
              "ja: { country: 'jp', language: 'ja' }",
              "'zh-Hans': { country: 'cn', language: 'zh-Hans-CN' }",
              "'zh-Hant': { country: 'tw', language: 'zh-Hant-TW' }",
              "ja: { language: 'ja', country: 'JP' }",
              "'zh-Hans': { language: 'zh-CN', country: 'CN' }",
              "'zh-Hant': { language: 'zh-TW', country: 'TW' }",
          ]:
              assert marker in product, f'missing core product localization marker: {marker}'

          bad_phrases = {
              'src/content/blog/fr/reuse-copied-text-snippets-iphone.md': [
                  'espaces accidentelles', 'espaces réservées',
              ],
              'src/content/blog/es/verify-audio-clips-before-combining.md': [
                  'formato de sample', 'del señal', 'Inventaría los archivos',
              ],
          }
          for file, phrases in bad_phrases.items():
              text = Path(file).read_text()
              for phrase in phrases:
                  assert phrase not in text, f'unreviewed phrase remains in {file}: {phrase}'

          for file in [
              'src/components/ExtendedBlogIndex.astro',
              'src/components/ExtendedBlogArticle.astro',
              'src/components/ExtendedReleaseNotePage.astro',
          ]:
              text = Path(file).read_text()
              assert '>Privacy</a>' not in text, f'English Privacy label remains in {file}'

          assert not Path('scripts/final-core-product-i18n.py').exists(), 'temporary core product script remains'
          assert not Path('.github/workflows/final-core-product-i18n-run.yml').exists(), 'temporary core product workflow remains'
          assert not Path('scripts/i18n-copy-polish.py').exists(), 'temporary copy polish script remains'
          assert not Path('.github/workflows/i18n-copy-polish-run.yml').exists(), 'temporary copy polish workflow remains'
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run nine-language regression suite
        run: >-
          npx playwright test
          tests/site-i18n.spec.ts
          tests/extended-i18n.spec.ts
          tests/papira-i18n.spec.ts
          tests/site-visual.spec.ts
          --project=desktop

      - name: Record successful audit
        run: |
          cat > docs/localization-audit-2026-08-25.md <<EOF
          # ONNELLAB website localization audit — 2026-08-25

          Status: PASS

          Audited commit: ${GITHUB_SHA}

          Languages: ko / en / ja / zh-Hans / zh-Hant / pt-BR / de / fr / es

          Verified:
          - all nine blog source sets have identical 9-post slug coverage;
          - Astro production build succeeds;
          - core and extended locale routing, canonical URLs and hreflang alternates pass regression tests;
          - product-to-privacy and product-to-release-note links remain in the selected language;
          - Papira localization, OAuth callback, release notes, sitemap and legacy Melivra privacy alias pass representative checks;
          - reviewed French and Spanish copy corrections are present;
          - temporary localization patch tooling is absent.
          EOF
          rm -f .github/workflows/final-localization-audit-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: pass final nine-language localization audit'
          git push origin HEAD:main
