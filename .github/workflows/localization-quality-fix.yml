name: Apply localization quality fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localization-quality-fix.yml'

permissions:
  contents: write

concurrency:
  group: localization-quality-fix-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure Git
        run: |
          git config user.name "ONNELLAB Automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Localize accessibility labels
        run: |
          node scripts/localization-fix-accessibility.mjs
          npm run build
          npx playwright test tests/accessibility-i18n.spec.ts --project=desktop
          git add src tests .github/workflows/i18n-smoke.yml
          git commit -m "Localize accessibility labels across nine languages"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Correct confirmed localization errors
        run: |
          node scripts/localization-fix-corrections.mjs
          npm run build
          git add src
          git commit -m "Correct confirmed localization errors"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Clarify privacy and purchase terminology
        run: |
          node scripts/localization-fix-legal.mjs
          npm run build
          git add src
          git commit -m "Clarify localized privacy and purchase terminology"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Rewrite public release notes for users
        run: |
          node scripts/localization-fix-release-notes.mjs
          npm run build
          npx playwright test tests/product-contract.spec.ts --project=desktop
          git add src
          git commit -m "Rewrite TagWeaver release notes for users"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Normalize terminology and add regression checks
        run: |
          node scripts/localization-fix-terminology.mjs
          npm run check:i18n-quality
          npm run build
          npx playwright test \
            tests/site-i18n.spec.ts \
            tests/accessibility-i18n.spec.ts \
            tests/extended-i18n.spec.ts \
            tests/papira-i18n.spec.ts \
            tests/product-contract.spec.ts \
            tests/site-visual.spec.ts \
            --project=desktop
          git add src tests scripts/check-localization-quality.mjs package.json .github/workflows/i18n-smoke.yml
          git commit -m "Normalize localized terminology and guard quality"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Remove one-time migration files
        run: |
          rm -f \
            scripts/localization-fix-utils.mjs \
            scripts/localization-fix-accessibility.mjs \
            scripts/localization-fix-corrections.mjs \
            scripts/localization-fix-legal.mjs \
            scripts/localization-fix-release-notes.mjs \
            scripts/localization-fix-terminology.mjs \
            .github/workflows/localization-quality-fix.yml
          git add -u
          git commit -m "Remove one-time localization migration"
          git pull --rebase origin main
          git push origin HEAD:main
