name: Sync Meriq icon once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-meriq-icon.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace Meriq website icon with app master
        run: |
          set -euo pipefail
          target='src/content/apps/meriq/assets/icon/meriq.png'
          temp="$(mktemp)"
          trap 'rm -f "$temp"' EXIT
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/onnellab/meriq/main/assets/icon/Meriq.png' \
            --output "$temp"
          test -s "$temp"
          file "$temp" | grep -q 'PNG image data'
          cp "$temp" "$target"

      - name: Commit exact icon bytes
        run: |
          set -euo pipefail
          if git diff --quiet -- src/content/apps/meriq/assets/icon/meriq.png; then
            echo 'Meriq icon is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/apps/meriq/assets/icon/meriq.png
          git commit -m 'assets: replace Meriq website icon'
          git push origin HEAD:main
