name: Definitive nine-language localization audit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply any pending deterministic localization patches
        run: |
          if [ -f scripts/final-core-product-i18n.py ]; then
            python3 scripts/final-core-product-i18n.py
          fi
          if [ -f scripts/upgrade-static-privacy-i18n.py ]; then
            python3 scripts/upgrade-static-privacy-i18n.py
          fi

      - name: Verify localization source parity and reviewed fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          locales = ['en','ko','ja','zh-Hans','zh-Hant','pt-BR','de','fr','es']
          root = Path('src/content/blog')
          expected = sorted(p.name for p in (root / 'en').glob('*.md'))
          assert len(expected) == 9, f'expected 9 English blog posts, found {len(expected)}'
          for locale in locales:
              actual = sorted(p.name for p in (root / locale).glob('*.md'))
              assert actual == expected, f'blog parity mismatch for {locale}: {actual}'

          product = Path('src/components/ProductTemplate.astro').read_text()
          for marker in [
              'releaseNoteKoPath',
              "ja: { country: 'jp', language: 'ja' }",
              "'zh-Hans': { country: 'cn', language: 'zh-Hans-CN' }",
              "'zh-Hant': { country: 'tw', language: 'zh-Hant-TW' }",
              "ja: { language: 'ja', country: 'JP' }",
              "'zh-Hans': { language: 'zh-CN', country: 'CN' }",
              "'zh-Hant': { language: 'zh-TW', country: 'TW' }",
          ]:
              assert marker in product, f'missing core product localization marker: {marker}'

          privacy_slugs = ['aligna','clipnest','melivra','meriq','quivra','segra','tagweaver','vaultxt']
          hreflangs = ['en','ko','ja','zh-Hans','zh-Hant','pt-BR','de','fr','es','x-default']
          for slug in privacy_slugs:
              for path in [
                  Path('public/privacy') / slug / 'index.html',
                  Path('public/privacy') / slug / 'ko' / 'index.html',
              ]:
                  text = path.read_text()
                  for lang in hreflangs:
                      assert f'hreflang="{lang}"' in text, f'{path}: missing hreflang {lang}'
                  assert text.count('data-locale-choice=') == 9, f'{path}: expected 9 language choices'

          bad_phrases = {
              'src/content/blog/fr/reuse-copied-text-snippets-iphone.md': ['espaces accidentelles', 'espaces réservées'],
              'src/content/blog/es/verify-audio-clips-before-combining.md': ['formato de sample', 'del señal', 'Inventaría los archivos'],
          }
          for file, phrases in bad_phrases.items():
              text = Path(file).read_text()
              for phrase in phrases:
                  assert phrase not in text, f'unreviewed phrase remains in {file}: {phrase}'

          for file in [
              'src/components/ExtendedBlogIndex.astro',
              'src/components/ExtendedBlogArticle.astro',
              'src/components/ExtendedReleaseNotePage.astro',
          ]:
              text = Path(file).read_text()
              assert '>Privacy</a>' not in text, f'English Privacy label remains in {file}'

          sitemap = Path('src/pages/sitemap.xml.ts').read_text()
          for marker in ['allSiteLocales', 'blogPostAlternates', 'releaseNoteEntries', 'productPrivacyEntries']:
              assert marker in sitemap, f'sitemap missing nine-language marker: {marker}'
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run nine-language regression suite
        run: >-
          npx playwright test
          tests/site-i18n.spec.ts
          tests/extended-i18n.spec.ts
          tests/papira-i18n.spec.ts
          tests/site-visual.spec.ts
          --project=desktop

      - name: Record definitive audit and clean one-time tooling
        run: |
          mkdir -p docs
          cat > docs/localization-audit-2026-08-25.md <<EOF
          # ONNELLAB website localization audit — 2026-08-25

          Status: PASS

          Audited commit: ${GITHUB_SHA}

          Languages: ko / en / ja / zh-Hans / zh-Hant / pt-BR / de / fr / es

          Verified:
          - all nine blog source sets have identical nine-post slug coverage;
          - all eight legacy app privacy-policy English/Korean source pages expose nine language choices and all nine hreflang alternates plus x-default;
          - Astro production build succeeds;
          - core and extended locale routing, canonical URLs and hreflang alternates pass Playwright regression tests;
          - product-to-privacy and product-to-release-note links stay in the selected language;
          - core Japanese/Simplified Chinese/Traditional Chinese store links use matching store locale parameters;
          - Papira localization, OAuth callback, release notes, sitemap and legacy Melivra privacy alias pass representative checks;
          - reviewed French and Spanish copy corrections are present;
          - extended blog and release-note navigation labels contain no reviewed English privacy-label residue.
          EOF

          rm -f scripts/final-core-product-i18n.py
          rm -f scripts/upgrade-static-privacy-i18n.py
          rm -f .github/workflows/final-core-product-i18n-run.yml
          rm -f .github/workflows/static-privacy-i18n-once.yml
          rm -f .github/workflows/final-localization-audit-once.yml
          rm -f .github/workflows/final-localization-audit-v2-once.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: pass definitive nine-language localization audit'
          git push origin HEAD:main
