name: Patch Papira extended copy once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-papira-extended-copy-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align Papira extended product copy with canonical product scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          path = Path('src/lib/extended-product-localizations.ts')
          text = path.read_text(encoding='utf-8')
          encoded = {
              "'pt-BR'": "",
              "de": "",
              "fr": "",
              "es": ""
          }

          replacements = {key: base64.b64decode(value).decode('utf-8') for key, value in encoded.items()}
          markers = [("'pt-BR'", '  de: {'), ('de', '  fr: {'), ('fr', '  es: {'), ('es', '\n};')]
          for locale_key, end_marker in markers:
              section_marker = "  'pt-BR': {" if locale_key == "'pt-BR'" else f'  {locale_key}: {{'
              start = text.index(section_marker)
              end = text.index(end_marker, start)
              section = text[start:end]
              papira_start = section.index('    papira: make(')
              section = section[:papira_start] + replacements[locale_key] + '\n'
              text = text[:start] + section + text[end:]

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/extended-product-localizations.ts
          git commit -m 'fix: align Papira extended product copy'
          git push origin HEAD:main
