name: Apply and verify Meriq copy

on:
  push:
    branches: [main]
    paths: [.github/workflows/meriq-copy-refresh.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed copy while preserving all other apps
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import textwrap

          # Reuse the reviewed literal copy from the immutable preparation commit.
          source = subprocess.check_output([
              'git', 'show',
              'fb4e69124b19737f2a980f091f2e085238665dd5:.github/workflows/meriq-copy-refresh.yml'
          ], text=True)
          match = re.search(r"^          python3 - <<'PY'\n(.*?)^          PY\n", source, re.M | re.S)
          assert match, 'Reviewed copy script is missing'
          code = textwrap.dedent(match.group(1))
          start = code.index('corrections = {')
          end = code.index('cjk_path.write_text(cjk)') + len('cjk_path.write_text(cjk)')
          replacement = '''assert subprocess.check_output(['git', 'hash-object', str(cjk_path)], text=True).strip() == '7921dcfe7843c09079f502ba71db3a0b15c2dd1a', 'CJK source changed concurrently'
          original = subprocess.check_output(['git', 'show', f'{base}:{cjk_path}'], text=True)
          cjk_pattern = re.compile(r'^    meriq: \{\n.*?^    \}\n', re.M | re.S)
          chunks = cjk_pattern.findall(cjk)
          assert len(chunks) == 3 and len(cjk_pattern.findall(original)) == 3
          reviewed_chunks = iter(chunks)
          cjk = cjk_pattern.sub(lambda _: next(reviewed_chunks), original)
          assert cjk_pattern.sub('', cjk) == cjk_pattern.sub('', original), 'Non-Meriq copy must remain identical'
          cjk_path.write_text(cjk)'''
          # Keep the regex escapes intact in the generated Python source.
          replacement = replacement.replace("r'^    meriq: \\{\n.*?^    \\}\n'", "r'^    meriq: \\{\\n.*?^    \\}\\n'")
          code = code[:start] + replacement + code[end:]
          exec(compile(code, '<reviewed-meriq-copy>', 'exec'), {})
          PY
      - name: Check whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Build all localized pages
        run: npm run build
      - name: Verify nine locale bodies, FAQs and rendered metadata
        run: npx playwright test tests/meriq-copy.spec.ts --project=desktop --reporter=line
      - name: Commit verified copy
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/product-localizations.ts src/lib/extended-product-localizations.ts src/content/apps/meriq/description-en.md
          git commit -m 'docs(meriq): complete nine-locale landing copy and verify scope'
          git pull --rebase origin main
          git push origin HEAD:main
