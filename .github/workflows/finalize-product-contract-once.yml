name: Finalize unified product contract once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply final product contract cleanup
        run: python3 scripts/finalize-product-contract.py

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full desktop regression gate
        run: >-
          npx playwright test
          tests/site-i18n.spec.ts
          tests/extended-i18n.spec.ts
          tests/papira-i18n.spec.ts
          tests/product-contract.spec.ts
          tests/site-visual.spec.ts
          --project=desktop

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit verified cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Cleanup produced no changes.' >&2
            exit 1
          fi
          git commit -m 'fix: finalize unified nine-language product contract'
          git push origin HEAD:main
