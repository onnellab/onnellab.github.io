name: Finalize product SEO semantics once

on:
  push:
    branches: [main]
    paths:
      - '.github/product-seo-patch-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply product SEO contract patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          extended_path = Path('src/lib/extended-product-localizations.ts')
          extended = extended_path.read_text(encoding='utf-8')
          for next_locale in ('de', 'fr', 'es'):
              extended = replace_once(
                  extended,
                  f"    ])\n  {next_locale}: {{",
                  f"    ])\n  }},\n  {next_locale}: {{",
                  f'Papira locale boundary before {next_locale}'
              )
          extended = replace_once(
              extended,
              "    ])\n};\n",
              "    ])\n  }\n};\n",
              'Papira final locale boundary'
          )
          extended_path.write_text(extended, encoding='utf-8')

          products_path = Path('src/lib/products.ts')
          products = products_path.read_text(encoding='utf-8')
          products = replace_once(
              products,
              "import { getExtendedProductCopy } from './extended-product-localizations';\n",
              "import { getExtendedProductCopy } from './extended-product-localizations';\nimport { getProductScreenshotAlts } from './product-screenshot-alts';\n",
              'products import'
          )
          products = replace_once(
              products,
              """  const seoDescription = seoPageDescription(source, copy);\n  const canonicalPath = allProductRouteFor(source.slug, locale);\n  return {\n    locale,\n    source,\n    meta: source.meta,\n    copy,\n    canonicalPath,\n    alternates: allProductLocaleAlternates(source.slug),\n    seoTitle: productSeoTitle(source, copy),\n    seoDescription,\n    iconPath: getIconRoutePath(source),\n    screenshotPaths: getScreenshotRoutePaths(source, locale),\n    accent: productAccent(source)\n  };\n""",
              """  const seoDescription = seoPageDescription(source, copy);\n  const canonicalPath = allProductRouteFor(source.slug, locale);\n  const screenshotPaths = getScreenshotRoutePaths(source, locale);\n  return {\n    locale,\n    source,\n    meta: source.meta,\n    copy,\n    canonicalPath,\n    alternates: allProductLocaleAlternates(source.slug),\n    seoTitle: productSeoTitle(source, copy),\n    seoDescription,\n    iconPath: getIconRoutePath(source),\n    screenshotPaths,\n    screenshotAlts: getProductScreenshotAlts(source.slug, locale, screenshotPaths.length),\n    accent: productAccent(source)\n  };\n""",
              'product page screenshot contract'
          )
          products_path.write_text(products, encoding='utf-8')

          template_path = Path('src/components/ProductTemplate.astro')
          template = template_path.read_text(encoding='utf-8')
          template = replace_once(
              template,
              """const faqJsonLd = {\n  '@context': 'https://schema.org',\n  '@type': 'FAQPage',\n  '@id': `${canonicalUrl.toString()}#faq`,\n  mainEntity: (faqContent?.items ?? []).map((item) => ({\n    '@type': 'Question',\n    name: item.question,\n    acceptedAnswer: {\n      '@type': 'Answer',\n      text: item.answer\n    }\n  }))\n};\n""",
              '',
              'FAQPage schema block'
          )
          template = replace_once(
              template,
              "  jsonLd={faqContent ? [jsonLd, breadcrumbJsonLd, faqJsonLd] : [jsonLd, breadcrumbJsonLd]}\n",
              "  jsonLd={[jsonLd, breadcrumbJsonLd]}\n",
              'BaseLayout schema list'
          )
          template_path.write_text(template, encoding='utf-8')

          test_path = Path('tests/product-contract.spec.ts')
          test = test_path.read_text(encoding='utf-8')
          test = replace_once(test, '      expect(faq).toBeTruthy();\n', '      expect(faq).toBeFalsy();\n', 'FAQ schema expectation')
          test = replace_once(
              test,
              '      expect(faq.mainEntity?.length ?? 0).toBeGreaterThanOrEqual(3);\n',
              "      expect(await page.locator('.faq-band details').count()).toBeGreaterThanOrEqual(3);\n",
              'visible FAQ expectation'
          )
          test = replace_once(
              test,
              """        await expect(image).toHaveAttribute('alt', /\\S+/);\n        await expect(image).toHaveAttribute('width', /\\d+/);\n        await expect(image).toHaveAttribute('height', /\\d+/);\n""",
              """        await expect(image).toHaveAttribute('alt', /\\S+/);\n        await expect(image).toHaveAttribute('width', /\\d+/);\n        await expect(image).toHaveAttribute('height', /\\d+/);\n        const alt = (await image.getAttribute('alt') ?? '').trim();\n        expect(alt.toLowerCase()).toContain(app.toLowerCase());\n        expect(alt).not.toMatch(/\\s\\d+$/);\n""",
              'semantic screenshot alt expectation'
          )
          semantic_test = r"""
const papiraExtendedScope = {
  'pt-BR': [/capa/i, /capítulo/i, /sumário/i, /projeto/i],
  de: [/Cover/i, /Kapitel/i, /Inhaltsverzeichnis/i, /Buchprojekt/i],
  fr: [/couverture/i, /chapitr/i, /table des matières/i, /projet/i],
  es: [/portada/i, /capítulo/i, /tabla de contenidos/i, /proyecto/i]
} as const;

test('Papira extended locales preserve the canonical book-project scope', async ({ page }) => {
  for (const locale of locales.filter((item) => item.code in papiraExtendedScope)) {
    await page.goto(routeFor('papira', locale.segment));
    const content = await page.locator('.content-band').innerText();
    for (const term of papiraExtendedScope[locale.code as keyof typeof papiraExtendedScope]) {
      expect(content).toMatch(term);
    }
  }
});

"""
          test = replace_once(
              test,
              "test('product sources permanently exclude price, rating, and review commerce metadata', () => {\n",
              semantic_test + "test('product sources permanently exclude price, rating, and review commerce metadata', () => {\n",
              'Papira semantic parity test insertion'
          )
          test = replace_once(
              test,
              "  expect(templateSource).not.toMatch(/\\bisAccessibleForFree\\s*:/);\n",
              "  expect(templateSource).not.toMatch(/\\bisAccessibleForFree\\s*:/);\n  expect(templateSource).not.toContain(\"'@type': 'FAQPage'\");\n",
              'FAQPage source guard'
          )
          test_path.write_text(test, encoding='utf-8')
          PY

          git diff --check
          npm ci
          npm run build

      - name: Commit source patch and remove one-time tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/product-seo-patch-trigger .github/workflows/finalize-product-seo-once.yml
          git add src/lib/extended-product-localizations.ts src/lib/products.ts src/components/ProductTemplate.astro tests/product-contract.spec.ts
          git commit -m 'fix: finalize product SEO semantics'
          git push origin HEAD:main
