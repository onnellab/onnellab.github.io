name: Apply localization quality fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localization-quality-fix-20260826-v2.yml'

permissions:
  contents: write

concurrency:
  group: localization-quality-fix
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure Git and synchronize main
        run: |
          git config user.name "ONNELLAB localization migration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare localization migration script
        run: |
          cat > /tmp/localization_quality_fix.py <<'PY'
          from __future__ import annotations

          import json
          import re
          import sys
          from pathlib import Path

          ROOT = Path.cwd()


          def path(rel: str) -> Path:
              return ROOT / rel


          def read(rel: str) -> str:
              return path(rel).read_text(encoding='utf-8')


          def write(rel: str, value: str) -> None:
              target = path(rel)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(value, encoding='utf-8')


          def replace(rel: str, old: str, new: str, *, required: bool = False) -> int:
              value = read(rel)
              count = value.count(old)
              if count == 0:
                  if required and new not in value:
                      raise RuntimeError(f'Missing expected text in {rel}: {old!r}')
                  return 0
              write(rel, value.replace(old, new))
              return count


          def replace_many(rel: str, replacements: dict[str, str]) -> int:
              value = read(rel)
              changed = 0
              for old, new in replacements.items():
                  count = value.count(old)
                  if count:
                      value = value.replace(old, new)
                      changed += count
              if changed:
                  write(rel, value)
              return changed


          def replace_tree(root: str, suffixes: tuple[str, ...], replacements: dict[str, str]) -> int:
              changed = 0
              for target in sorted(path(root).rglob('*')):
                  if not target.is_file() or target.suffix not in suffixes:
                      continue
                  value = target.read_text(encoding='utf-8')
                  original = value
                  for old, new in replacements.items():
                      value = value.replace(old, new)
                  if value != original:
                      target.write_text(value, encoding='utf-8')
                      changed += 1
              return changed


          def ensure_astro_import(rel: str, import_line: str) -> None:
              value = read(rel)
              if import_line in value:
                  return
              if not value.startswith('---\n'):
                  raise RuntimeError(f'Unexpected Astro frontmatter in {rel}')
              write(rel, value.replace('---\n', f'---\n{import_line}\n', 1))


