          ACCESSIBILITY_TEST = """import { expect, test } from '@playwright/test';

const locales = [
  { code: 'en', segment: '', navigation: 'Navigation', platforms: 'Platforms', privacy: 'Privacy Policy', terms: 'Terms' },
  { code: 'ko', segment: 'ko', navigation: '탐색', platforms: '플랫폼', privacy: '개인정보 처리방침', terms: '이용약관' },
  { code: 'ja', segment: 'ja', navigation: 'ナビゲーション', platforms: '対応プラットフォーム', privacy: 'プライバシーポリシー', terms: '利用規約' },
  { code: 'zh-Hans', segment: 'zh-hans', navigation: '导航', platforms: '支持平台', privacy: '隐私政策', terms: '使用条款' },
  { code: 'zh-Hant', segment: 'zh-hant', navigation: '導覽', platforms: '支援平台', privacy: '隱私權政策', terms: '使用條款' },
  { code: 'pt-BR', segment: 'pt-br', navigation: 'Navegação', privacy: 'Política de Privacidade', terms: 'Termos de Uso' },
  { code: 'de', segment: 'de', navigation: 'Navigation', privacy: 'Datenschutzerklärung', terms: 'Nutzungsbedingungen' },
  { code: 'fr', segment: 'fr', navigation: 'Navigation', privacy: 'Politique de confidentialité', terms: 'Conditions d’utilisation' },
  { code: 'es', segment: 'es', navigation: 'Navegación', privacy: 'Política de privacidad', terms: 'Términos de uso' }
] as const;

const localized = (base: string, segment: string) => segment ? `${base}${segment}/` : base;

test.describe('localized accessibility labels', () => {
  for (const locale of locales) {
    test(`core navigation ${locale.code}`, async ({ page }) => {
      await page.goto(localized('/apps/', locale.segment));
      await expect(page.locator(`nav[aria-label="${locale.navigation}"]`)).toHaveCount(1);
      if ('platforms' in locale) {
        await expect(page.locator(`.platform-badges[aria-label="${locale.platforms}"]`).first()).toBeVisible();
      }
    });

    test(`OAuth footer ${locale.code}`, async ({ page }) => {
      await page.goto(localized('/oauth/x/callback/', locale.segment));
      await expect(page.locator('footer').getByRole('link', { name: locale.privacy, exact: true })).toHaveCount(1);
      await expect(page.locator('footer').getByRole('link', { name: locale.terms, exact: true })).toHaveCount(1);
    });
  }

  test('Korean blog article localizes non-visible controls', async ({ page }) => {
    await page.goto('/blog/ko/read-large-txt-files-without-lag/');
    await expect(page.locator('nav[aria-label="글 탐색"]')).toHaveCount(1);
    await expect(page.locator('[aria-label="글 정보"]')).toHaveCount(1);
    await expect(page.locator('dialog[aria-label="글 이미지"]')).toHaveCount(1);
    await expect(page.locator('button[aria-label="닫기"]')).toHaveCount(1);
  });
});
"""


          QUALITY_CHECKER = """import fs from 'node:fs';
import path from 'node:path';

const root = path.resolve(process.cwd(), 'src');
const banned = [
  'aria-label="Navigation"',
  'aria-label="Platforms"',
  'aria-label="Blog navigation"',
  'aria-label="Article navigation"',
  'aria-label="Article metadata"',
  'aria-label="Article image"',
  'aria-label="Close"',
  '驗證與回復購買',
  'Vom App verwaltete',
  'Warum große Textdateien langsam öffnen',
  '一つをSoTにして',
  'feat. 表记',
  'feat. 表記',
  'Calmo por padrão',
  'Subjektbezeichner',
  "updated: 'Policy date'"
];

const failures = [];
const walk = (directory) => {
  for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
    const fullPath = path.join(directory, entry.name);
    if (entry.isDirectory()) walk(fullPath);
    else if (/\\.(?:astro|ts|md)$/.test(entry.name)) {
      const source = fs.readFileSync(fullPath, 'utf8');
      for (const phrase of banned) {
        if (source.includes(phrase)) failures.push(`${path.relative(process.cwd(), fullPath)}: ${phrase}`);
      }
    }
  }
};
walk(root);
if (failures.length) {
  console.error('Localization quality guard failed:\n' + failures.map((item) => `- ${item}`).join('\n'));
  process.exit(1);
}
console.log('Localization quality guard passed.');
"""


          def accessibility() -> None:
              write('src/lib/ui-labels.ts', UI_LABELS)
              attrs = {
                  'aria-label="Navigation"': 'aria-label={uiLabels[OWNER].navigation}',
                  'aria-label="Platforms"': 'aria-label={uiLabels[OWNER].platforms}',
                  'aria-label="Blog navigation"': 'aria-label={uiLabels[OWNER].blogNavigation}',
                  'aria-label="Article navigation"': 'aria-label={uiLabels[OWNER].articleNavigation}',
                  'aria-label="Article metadata"': 'aria-label={uiLabels[OWNER].articleMetadata}',
                  'aria-label="Article image"': 'aria-label={uiLabels[OWNER].articleImage}',
                  'aria-label="Close"': 'aria-label={uiLabels[OWNER].close}'
              }
              for target in sorted(path('src/components').glob('*.astro')):
                  value = target.read_text(encoding='utf-8')
                  if not any(old in value for old in attrs):
                      continue
                  match = re.search(r'const\s*\{[^}]*\blocale\b[^}]*\}\s*=\s*Astro\.props', value, re.S)
                  owner = 'locale' if match else 'lang' if re.search(r'const\s*\{[^}]*\blang\b[^}]*\}\s*=\s*Astro\.props', value, re.S) else None
                  if owner is None:
                      raise RuntimeError(f'Cannot resolve locale variable for {target}')
                  rel = target.relative_to(ROOT).as_posix()
                  ensure_astro_import(rel, "import { uiLabels } from '../lib/ui-labels';")
                  value = read(rel)
                  for old, template in attrs.items():
                      value = value.replace(old, template.replace('OWNER', owner))
                  write(rel, value)

              oauth = 'src/components/OAuthCallbackPage.astro'
              ensure_astro_import(oauth, "import { uiLabels } from '../lib/ui-labels';")
              replace(oauth, '<nav class="topbar">', '<nav class="topbar" aria-label={uiLabels[locale].navigation}>')
              replace(
                  oauth,
                  '<footer><a href={allRouteFor(\'privacy\',locale)}>Privacy</a><a href={allRouteFor(\'terms\',locale)}>Terms</a>',
                  '<footer><a href={allRouteFor(\'privacy\',locale)}>{uiLabels[locale].privacyPolicy}</a><a href={allRouteFor(\'terms\',locale)}>{uiLabels[locale].terms}</a>'
              )

              privacy_index = 'src/components/PrivacyIndex.astro'
              ensure_astro_import(privacy_index, "import { uiLabels } from '../lib/ui-labels';")
              replace(
                  privacy_index,
                  'name: `${policy.title} Privacy Policy`,',
                  'name: `${policy.title} ${uiLabels[locale].privacyPolicy}`,'
              )

              write('tests/accessibility-i18n.spec.ts', ACCESSIBILITY_TEST)
              workflow = '.github/workflows/i18n-smoke.yml'
              value = read(workflow)
              marker = '          tests/site-i18n.spec.ts\n'
              addition = '          tests/accessibility-i18n.spec.ts\n'
              if addition not in value:
                  if marker not in value:
                      raise RuntimeError('Unable to add accessibility test to i18n workflow')
                  value = value.replace(marker, marker + addition, 1)
                  write(workflow, value)


