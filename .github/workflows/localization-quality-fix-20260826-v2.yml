          npm run build
          npx playwright test tests/site-i18n.spec.ts tests/extended-i18n.spec.ts tests/papira-i18n.spec.ts tests/product-contract.spec.ts tests/accessibility-i18n.spec.ts tests/site-visual.spec.ts --project=desktop
          git diff --check
