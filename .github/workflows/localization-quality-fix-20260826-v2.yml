              scripts = package.setdefault('scripts', {})
              scripts['check:i18n-quality'] = 'node scripts/check-localization-quality.mjs'
              write('package.json', json.dumps(package, ensure_ascii=False, indent=2) + '\n')

              workflow = '.github/workflows/i18n-smoke.yml'
              value = read(workflow)
              step = "\n      - name: Check localization quality\n        run: npm run check:i18n-quality\n"
              marker = "\n      - name: Build site\n        run: npm run build\n"
              if step not in value:
                  if marker not in value:
                      raise RuntimeError('Unable to add localization quality check to workflow')
                  value = value.replace(marker, marker + step, 1)
                  write(workflow, value)


          GROUPS = {
              'accessibility': accessibility,
              'corrections': corrections,
              'legal': legal,
              'release-notes': release_notes,
              'terminology': terminology
          }

          if len(sys.argv) != 2 or sys.argv[1] not in GROUPS:
              raise SystemExit(f'Usage: {sys.argv[0]} ' + '|'.join(GROUPS))
          GROUPS[sys.argv[1]]()
          PY

      - name: Localize accessibility labels across nine languages
        run: |
          python /tmp/localization_quality_fix.py accessibility
          npm run build
          npx playwright test tests/accessibility-i18n.spec.ts tests/site-i18n.spec.ts tests/extended-i18n.spec.ts --project=desktop
          git diff --check
          git add src/lib/ui-labels.ts src/components tests/accessibility-i18n.spec.ts .github/workflows/i18n-smoke.yml
          if ! git diff --cached --quiet; then
            git commit -m "Localize accessibility labels across nine languages"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Correct confirmed localization errors
        run: |
          python /tmp/localization_quality_fix.py corrections
