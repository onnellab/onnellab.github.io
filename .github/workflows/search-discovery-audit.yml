name: Audit live search discovery

on:
  schedule:
    - cron: '25 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-discovery-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public sitemap, crawler policy, canonical sample and ownership file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python3 scripts/search_discovery.py audit
