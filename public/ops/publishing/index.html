<script>
(async()=>{
 const record=JSON.parse(document.getElementById('ops-sealed-data').textContent);
 const storageKey='onnellab-ops-session-'+record.salt;
 const input=document.getElementById('password');
 const button=document.getElementById('submit');
 const message=document.getElementById('message');
 const bytes=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
 async function decode(raw) {
   const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
   const combined=new Uint8Array(bytes(record.data).length+16);
   combined.set(bytes(record.data));combined.set(bytes(record.tag),combined.length-16);
   const plaintext=await crypto.subtle.decrypt({
     name:'AES-GCM',iv:bytes(record.iv),
     additionalData:new TextEncoder().encode(record.path)
   },key,combined);
   const zipped=new Blob([plaintext]).stream().pipeThrough(new DecompressionStream('gzip'));
   return await new Response(zipped).text();
 }
 async function unlock(raw,remember) {
   const body=await decode(raw);
   if(remember)sessionStorage.setItem(storageKey,b64(raw));
   // Prevent older, pre-encryption service workers from continuing to serve old dashboard HTML.
   try{
     if('serviceWorker' in navigator){
       const regs=await navigator.serviceWorker.getRegistrations();
       await Promise.all(regs.filter(r=>r.scope.includes('/ops/')).map(r=>r.unregister()));
     }
     if('caches' in window){
       const keys=await caches.keys();
       await Promise.all(keys.filter(k=>k.includes('ops')||k.includes('onnel')).map(k=>caches.delete(k)));
     }
   }catch{}
   document.open();document.write(body);document.close();
 }
 try{
   const cached=sessionStorage.getItem(storageKey);
   if(cached){try{await unlock(bytes(cached),false);return;}catch{sessionStorage.removeItem(storageKey);}}
 }catch{}
 document.getElementById('unlock').addEventListener('submit',async event=>{
   event.preventDefault();button.disabled=true;message.textContent='';
   try{
     const master=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveBits']);
     const key=await crypto.subtle.deriveBits(
       {name:'PBKDF2',salt:bytes(record.salt),iterations:record.it,hash:'SHA-256'},master,256);
     await unlock(new Uint8Array(key),true);
   }catch{
     input.value='';
     message.textContent='비밀번호가 올바르지 않거나 데이터를 열 수 없어요.';
   }finally{button.disabled=false;}
 });
})();
</script></body></html>
