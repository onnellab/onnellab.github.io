<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">이름은 일관되게, 크레딧은 그대로</title>
  <desc id="desc">정확한 발매판을 확인하고 검증한 앨범 제목 하나를 선택하되, 각 곡에 표기된 아티스트는 보존해요. 작업용 복사본을 편집하고 공통값은 해당하는 파일에만 적용한 다음, 저장 결과를 다시 열고 사용하는 플레이어에서 확인해요.</desc>
  <rect width="1200" height="675" fill="#fbf7ef"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#f7f2e9" stroke="#ded7ca" stroke-width="1.8"/>
  <text fill="#30302c" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="38" font-weight="680"><tspan x="92" y="100">이름은 일관되게, 크레딧은 그대로</tspan></text>
  <text fill="#69645c" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="19"><tspan x="92" y="134">태그를 편집하기 전에 발매판을 확인해요 · 앨범과 아티스트 태그</tspan></text>
  <g transform="translate(72 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">1. 식별</tspan></text><text fill="#5f5b54" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">정확한 발매판을</tspan><tspan x="24" y="105">확인해요</tspan></text></g><g transform="translate(346 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">2. 비교</tspan></text><text fill="#5f5b54" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">공통 항목과 개별</tspan><tspan x="24" y="105">항목을 나눠요</tspan></text></g><g transform="translate(620 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">3. 저장</tspan></text><text fill="#5f5b54" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">소규모 작업용</tspan><tspan x="24" y="105">파일부터 수정해요</tspan></text></g><g transform="translate(894 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">4. 검증</tspan></text><text fill="#5f5b54" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">파일을 다시 열고</tspan><tspan x="24" y="105">플레이어에서</tspan><tspan x="24" y="126">확인해요</tspan></text></g>
  <path d="M280 237H328m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M554 237H602m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M828 237H876m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="92" y="456" width="1016" height="82" rx="18" fill="#e7f2fb" stroke="#b9d7ea" stroke-width="1.6"/>
  <text x="124" y="506" fill="#30302c" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="20" font-weight="650">앨범 정보는 공유하고 곡별 차이는 보존해요.</text>
