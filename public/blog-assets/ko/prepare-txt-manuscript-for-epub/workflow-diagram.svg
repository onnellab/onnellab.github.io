<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">신뢰할 수 있는 EPUB 변환을 위해 TXT 원고를 준비하는 방법 워크플로</title>
  <desc id="desc">TXT 원고 EPUB 준비을 위한 ONNELLAB 워크플로 다이어그램입니다.</desc>
  <rect width="1200" height="675" fill="#fbf7ef"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#f7f2e9" stroke="#ded7ca" stroke-width="1.8"/>
  <text fill="#30302c" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="38" font-weight="680"><tspan x="92" y="112">신뢰할 수 있는 EPUB 변환을 위해 TXT 원고를 준비하는 방법</tspan><tspan x="92" y="156">워크플로</tspan></text>
  <text fill="#69645c" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="19"><tspan x="92" y="184">실용 워크플로 · TXT 원고 EPUB 준비</tspan></text>
  <g transform="translate(72 220)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="20" font-weight="650">1. 문제</text><text fill="#5f5b54" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">읽기 작업 확인</tspan></text></g><g transform="translate(346 220)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="20" font-weight="650">2. 점검</text><text fill="#5f5b54" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">파일과 맥락 확인</tspan></text></g><g transform="translate(620 220)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="20" font-weight="650">3. 흐름</text><text fill="#5f5b54" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">가벼운 경로 선택</tspan></text></g><g transform="translate(894 220)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="20" font-weight="650">4. 결과</text><text fill="#5f5b54" font-family="Pretendard, SUIT, Noto Sans KR, Apple SD Gothic Neo, Inter, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">마찰을 줄여 읽기</tspan></text></g>
