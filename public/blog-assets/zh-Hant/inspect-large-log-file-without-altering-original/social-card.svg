  <text x="118" y="121" fill="#24465c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="18" font-weight="700">閱讀</text>
  <text x="92" y="218" fill="#282723" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="54" font-weight="760"><tspan x="92" y="218">如何在不更動原始檔的情況下檢查大型</tspan><tspan x="92" y="282">記錄檔</tspan></text>
  <text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="24"><tspan x="92" y="410">透過保存原始檔、檢查工作副本、限定時間範圍與記錄觀察，安全檢查大型記錄檔。涵蓋</tspan><tspan x="92" y="444">搜尋步驟、事件脈絡、敏感資訊與衍生檔管理。</tspan></text>
