  <text x="118" y="121" fill="#24465c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="18" font-weight="700">閱讀</text>
  <text x="92" y="218" fill="#282723" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="54" font-weight="760"><tspan x="92" y="218">TXT 稿件轉</tspan><tspan x="92" y="282">EPUB：轉換前的準備與檢查</tspan></text>
  <text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="24"><tspan x="92" y="410">保留 TXT 原稿，確認字元編碼、章節結構與書籍資訊，再產生並驗證</tspan><tspan x="92" y="444">EPUB。了解完整的準備步驟，以及 Papira 在電子書製作中的用途與限制。</tspan></text>
